hould be introduced","parents have a crucial role to play in","equipping children with the skills to"]}],"descriptors":{"criteria":[{"key":"TR","name":"Task Response","nameVi":"Trả lời đúng yêu cầu đề","bands":{"5":"Bài trả lời đề nhưng chỉ ở mức chung chung, có đoạn lạc ý hoặc thiếu triển khai; overview có thể chưa nêu rõ xu hướng chính, nhiều ý được liệt kê nhưng không giải thích hay minh họa bằng số liệu cụ thể.","6":"Bài trả lời đủ các yêu cầu của đề, quan điểm được thể hiện xuyên suốt nhưng một số ý còn chung chung hoặc chưa được phát triển đầy đủ; Task 1 có overview nhưng chưa chọn lọc kỹ đặc điểm nổi bật nhất.","7":"Bài trả lời rõ ràng, bám sát đề, các ý được triển khai và minh chứng cụ thể dù đôi chỗ chưa thật sâu sắc; Task 1 có overview chính xác nêu đúng các xu hướng chủ đạo, ít dữ liệu thừa.","8":"Bài trả lời đầy đủ, mọi ý đều được phát triển logic và có minh chứng thuyết phục, quan điểm nhất quán và rõ ràng ngay từ mở bài; Task 1 chọn lọc chính xác các đặc điểm nổi bật nhất kèm số liệu minh họa hợp lý."},"fixes":["Task 2: luôn trả lời tất cả các phần của câu hỏi (ví dụ đề 'discuss both views and give your opinion' phải có đủ 2 phần)","Task 1: viết overview ngay sau mở bài, chỉ nêu 2-3 xu hướng lớn nhất, không đưa số liệu chi tiết vào overview","Tránh viết ý chung chung kiểu 'this has many advantages' mà không nêu cụ thể advantage nào"]},{"key":"CC","name":"Coherence and Cohesion","nameVi":"Mạch lạc và liên kết","bands":{"5":"Bài có tổ chức thành đoạn nhưng chưa rõ ràng, các câu trong đoạn đôi khi rời rạc; từ nối được dùng nhưng lặp lại hoặc dùng sai (ví dụ lạm dụng 'moreover', 'in addition' liên tục).","6":"Bài có bố cục rõ với mở-thân-kết, mỗi đoạn thân bài tập trung một ý chính nhưng đôi khi chuyển ý còn hơi đột ngột; từ nối đa dạng hơn nhưng thỉnh thoảng dùng chưa tự nhiên.","7":"Bố cục logic, mỗi đoạn có câu chủ đề rõ ràng và các câu hỗ trợ liên kết chặt chẽ; từ nối được dùng linh hoạt, tự nhiên, không gây cảm giác gượng ép hay lặp từ.","8":"Bài mạch lạc từ đầu đến cuối, ý tưởng phát triển logic và liền mạch giữa các đoạn mà không cần dùng quá nhiều từ nối rõ rệt; việc dùng đại từ thay thế, từ đồng nghĩa để liên kết câu rất tự nhiên."},"fixes":["Mỗi đoạn thân bài chỉ nên chứa 1 ý chính, bắt đầu bằng câu chủ đề (topic sentence) rõ ràng","Không lạm dụng từ nối 'Firstly, Secondly, Moreover' ở đầu mọi câu — hãy liên kết ý bằng đại từ (this, such) hoặc từ đồng nghĩa","Kiểm tra mỗi đoạn có tối thiểu 1 câu giải thích và 1 câu ví dụ/minh chứng để tránh đoạn văn quá ngắn, rời rạc"]},{"key":"LR","name":"Lexical Resource","nameVi":"Vốn từ vựng","bands":{"5":"Vốn từ đủ dùng cho các chủ đề quen thuộc nhưng còn hạn chế, lặp từ nhiều, thỉnh thoảng dùng từ chưa đúng nghĩa hoặc sai collocation cơ bản (ví dụ 'do a mistake' thay vì 'make a mistake').","6":"Vốn từ đủ rộng để bàn về hầu hết chủ đề, có cố gắng dùng từ ít thông dụng hơn nhưng đôi khi chưa chính xác; lỗi chính tả/collocation vẫn xuất hiện nhưng không cản trở người đọc hiểu ý.","7":"Vốn từ khá đa dạng, biết dùng từ đồng nghĩa để tránh lặp và một số collocation tự nhiên; vẫn còn vài lỗi nhỏ khi dùng từ ít quen thuộc nhưng không ảnh hưởng đến nghĩa.","8":"Vốn từ phong phú, dùng từ chính xác và linh hoạt theo ngữ cảnh, kể cả từ vựng học thuật và cách diễn đạt tự nhiên; lỗi rất hiếm và chỉ mang tính 'trượt tay' chứ không phải lỗi hệ thống."},"fixes":["Tránh lặp lại từ khóa của đề (ví dụ 'education') quá nhiều lần — thay bằng từ đồng nghĩa hoặc cách diễn đạt khác (schooling, academic training...)","Học collocation theo cụm thay vì từ đơn lẻ (ví dụ 'raise awareness', 'a heated debate') để tránh lỗi kết hợp từ sai","Không cố nhét từ 'khó' không chắc nghĩa để gây ấn tượng — dùng sai còn tệ hơn dùng từ đơn giản nhưng chính xác"]},{"key":"GRA","name":"Grammatical Range and Accuracy","nameVi":"Ngữ pháp","bands":{"5":"Câu đơn được dùng chính xác nhưng câu phức thường mắc lỗi (chia động từ, mệnh đề quan hệ, giới từ) khiến người đọc đôi khi phải đọc lại để hiểu ý.","6":"Kết hợp được similar to one another?","What are the benefits of city planning for tourism?","How might future cities be designed differently to attract visitors?"]}],"descriptors":{"criteria":[{"key":"FC","name":"Fluency and Coherence","nameVi":"Độ trôi chảy và mạch lạc","bands":{"5":"Nói được liên tục ở mức độ vừa phải nhưng thường xuyên ngập ngừng, lặp lại hoặc tự sửa lời khi gặp câu hỏi khó; đôi khi phải dùng câu quá ngắn để tránh mất mạch nói.","6":"Duy trì được mạch nói ổn định phần lớn thời gian, có ngập ngừng khi tìm từ hoặc ý tưởng nhưng không làm gián đoạn giao tiếp; biết dùng một số từ nối cơ bản để liên kết ý.","7":"Nói khá trôi chảy với tốc độ tự nhiên, chỉ ngập ngừng khi tìm cách diễn đạt ý phức tạp; ý tưởng được sắp xếp mạch lạc và có sử dụng từ nối đa dạng.","8":"Nói trôi chảy gần như liên tục, hiếm khi ngập ngừng và nếu có thì chỉ để suy nghĩ nội dung chứ không phải vì thiếu từ; triển khai ý chi tiết, mạch lạc một cách tự nhiên."},"fixes":["Khi bí từ, dùng chiến thuật diễn giải (paraphrase) thay vì im lặng hoặc kéo dài 'umm'","Luyện trả lời Part 2 đủ 1-2 phút bằng cách bám theo cue card thay vì dừng sớm","Tập nối ý bằng linking words tự nhiên (well, actually, to be honest) thay vì chỉ dùng 'and, but, so' lặp lại"]},{"key":"LR","name":"Lexical Resource","nameVi":"Vốn từ vựng","bands":{"5":"Vốn từ đủ nói về chủ đề quen thuộc nhưng hạn chế khi gặp chủ đề lạ, thường lặp từ hoặc dùng từ chung chung (nice, good) thay vì từ cụ thể hơn.","6":"Vốn từ đủ rộng để diễn đạt ý dù đôi khi chọn từ chưa thật chính xác; có cố gắng dùng cụm từ tự nhiên hơn nhưng đôi khi hơi gượng.","7":"Vốn từ linh hoạt, dùng được từ vựng ít thông dụng và một số cách diễn đạt tự nhiên để nêu quan điểm và cảm xúc; có khả năng diễn giải khi thiếu từ chính xác.","8":"Vốn từ phong phú và tự nhiên, dùng thành ngữ và cách diễn đạt phù hợp ngữ cảnh một cách linh hoạt như người nói có kinh nghiệm; hiếm khi phải diễn giải vì thiếu từ."},"fixes":["Học sẵn 5-6 cụm từ vựng chủ đề cho mỗi topic Part 1/2 thường  'comFORtable' chứ không phải 'COMfortable')","Tập ngữ điệu lên xuống theo cảm xúc câu nói thay vì nói đều đều (monotone)","Chú ý phát âm rõ phụ âm cuối (-s, -ed, -t) vì tiếng Việt không có âm cuối tương tự, dễ bị nuốt âm"]}]}};

<script>
/* ============ Sổ Luyện IELTS — core ============ */
const V = window.DATA_VOCAB, R = window.DATA_READING, L = window.DATA_LISTENING,
      W = window.DATA_WRITING, S = window.DATA_SPEAKING;

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const dayKey = (d) => { const x = d || new Date(); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const DAY = 864e5;

/* ---------- state ---------- */
const KEY = "so-luyen-ielts.v1";
const blank = () => ({
  name: "",
  onboarded: false,
  target: 7,
  rate: 1,
  srs: {},          // word -> {ivl, ease, due, reps, lapses}
  seen: {},         // packId -> true when opened
  reading: {},      // id -> {best, attempts, last}
  listening: {},
  writing: {},      // id -> {text, bands, overall, at}
  speaking: {},     // id -> {notes, bands, overall, at}
  marks: {},        // sourceId -> [{li, a, b, c, at}]
  book: {},         // word -> {ipa, vi, src, at}
  days: {},         // dayKey -> {cards, acts}
  savedAt: 0,
  newToday: { d: "", n: 0 }
});
let ST = blank();
try { const raw = localStorage.getItem(KEY); if (raw) ST = Object.assign(blank(), JSON.parse(raw)); } catch (e) { }
let saveT = null;
function save() {
  ST.savedAt = Date.now();
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { } }, 200);
  if (typeof schedulePush === "function") schedulePush();
}
function logAct(kind, n) {
  const k = dayKey(); ST.days[k] = ST.days[k] || { cards: 0, acts: 0 };
  if (kind === "cards") ST.days[k].cards += (n || 1);
  ST.days[k].acts += 1; save();
}

/* ---------- band tables ---------- */
const RB = [[39, 9], [37, 8.5], [35, 8], [33, 7.5], [30, 7], [27, 6.5], [23, 6], [19, 5.5], [15, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3]];
const LB = [[39, 9], [37, 8.5], [35, 8], [32, 7.5], [30, 7], [26, 6.5], [23, 6], [18, 5.5], [16, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3]];
function toBand(correct, total, table) {
  const raw = Math.round(correct / total * 40);
  for (const [t, b] of table) if (raw >= t) return b;
  return 2.5;
}
const bandColor = b => b >= 7 ? "var(--ok)" : b >= 6 ? "var(--accent)" : b >= 5 ? "var(--warn)" : "var(--bad)";
const fmtBand = b => (b == null || isNaN(b)) ? "–" : Number(b).toFixed(1);

/* ---------- skill estimates ---------- */
function avgBest(store) {
  const v = Object.values(store).map(x => x.best).filter(x => typeof x === "number");
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function skillBands() {
  const w = Object.values(ST.writing).map(x => x.overall).filter(Boolean);
  const s = Object.values(ST.speaking).map(x => x.overall).filter(Boolean);
  return {
    L: avgBest(ST.listening), R: avgBest(ST.reading),
    W: w.length ? w.reduce((a, b) => a + b, 0) / w.length : null,
    S: s.length ? s.reduce((a, b) => a + b, 0) / s.length : null
  };
}
function overallBand() {
  const b = skillBands(); const v = [b.L, b.R, b.W, b.S].filter(x => x != null);
  if (!v.length) return null;
  const m = v.reduce((a, c) => a + c, 0) / v.length;
  return Math.round(m * 2) / 2;
}

/* ---------- SRS ---------- */
const allWords = () => V.packs.flatMap(p => p.words.map(w => Object.assign({ pack: p.id, packName: p.name }, w)));
const WORDS = allWords();
const wIndex = {}; WORDS.forEach(w => wIndex[w.w] = w);
function dueCount() { const now = Date.now(); return Object.entries(ST.srs).filter(([k, v]) => v.due <= now).length; }
function learnedCount() { return Object.values(ST.srs).filter(v => v.ivl >= 7).length; }
function newAllowance() {
  const k = dayKey(); if (ST.newToday.d !== k) { ST.newToday = { d: k, n: 0 }; }
  return Math.max(0, 20 - ST.newToday.n);
}
function buildQueue(packId) {
  const now = Date.now();
  const pool = packId ? WORDS.filter(w => w.pack === packId) : WORDS;
  const due = pool.filter(w => ST.srs[w.w] && ST.srs[w.w].due <= now);
  const fresh = pool.filter(w => !ST.srs[w.w]).slice(0, packId ? 20 : newAllowance());
  const q = due.concat(fresh);
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
  return q;
}
function grade(word, g) {           // 0 again, 1 hard, 2 good, 3 easy
  const c = ST.srs[word] || { ivl: 0, ease: 2.4, reps: 0, lapses: 0, due: 0 };
  const isNew = c.reps === 0;
  if (isNew) { ST.newToday.n = (ST.newToday.n || 0) + 1; }
  if (g === 0) { c.ivl = 0; c.ease = Math.max(1.6, c.ease - 0.2); c.lapses++; }
  else if (g === 1) { c.ivl = c.ivl ? Math.max(1, c.ivl * 1.2) : 1; c.ease = Math.max(1.6, c.ease - 0.1); }
  else if (g === 2) { c.ivl = c.ivl ? c.ivl * c.ease : 1; }
  else { c.ivl = c.ivl ? c.ivl * c.ease * 1.35 : 3; c.ease = Math.min(3.1, c.ease + 0.1); }
  c.reps++; c.due = Date.now() + Math.max(0.007, c.ivl) * DAY;
  ST.srs[word] = c; logAct("cards", 1);
  return c;
}

/* ---------- streak ---------- */
function streak() {
  let n = 0; const d = new Date();
  if (!ST.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  for (; ;) { if (ST.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function week() {
  const out = []; const names = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); out.push({ n: names[d.getDay()], on: !!ST.days[dayKey(d)] }); }
  return out;
}

/* ---------- ui bits ---------- */
function toast(msg) {
  const t = el('<div class="toast">' + esc(msg) + "</div>"); document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function animateDials(root) {
  requestAnimationFrame(() => {
    $$("circle.val[data-dash]", root).forEach(c => { c.setAttribute("stroke-dasharray", c.dataset.dash); });
  });
}
function dial(label, value, target) {
  const r = 24, c = 2 * Math.PI * r, pct = value == null ? 0 : Math.min(1, value / 9);
  const col = value == null ? "var(--line-2)" : bandColor(value);
  return '<div class="dial"><svg width="62" height="62" viewBox="0 0 62 62" role="img" aria-label="' + esc(label) + " " + fmtBand(value) + '">' +
    '<circle cx="31" cy="31" r="' + r + '" fill="none" stroke="var(--sunk)" stroke-width="6"/>' +
    '<circle class="val" data-dash="' + (c * pct).toFixed(1) + " " + c.toFixed(1) + '" cx="31" cy="31" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 ' + c.toFixed(1) + '" transform="rotate(-90 31 31)"/>' +
    '<text x="31" y="36" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="var(--ink)">' + fmtBand(value) + "</text></svg>" +
    '<div class="k">' + esc(label) + "</div></div>";
}
/* Chấm AI: trong Claude artifact dùng capability sample; bản web dùng /api/grade */
async function aiJson(prompt) {
  if (window.claude && claude.use) {
    let s = null;
    try { s = await claude.use("sample"); } catch (e) { s = null; }
    if (s) return await s.json(prompt, { modelTier: "complex" });
  }
  let r;
  try { r = await fetch("/api/grade", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt: prompt }) }); }
  catch (e) { const x = new Error("Không kết nối được máy chủ chấm bài."); x.code = "offline"; throw x; }
  let j = null; try { j = await r.json(); } catch (e) { }
  if (!r.ok) { const x = new Error((j && j.message) || ("Máy chủ trả lỗi " + r.status)); x.code = (j && j.error) || "http_" + r.status; throw x; }
  return j;
}
function aiErrorHtml(e) {
  const c = e && e.code;
  const m = c === "no_key" ? "Máy chủ chưa được gắn API key, nên chưa chấm được. Chủ trang cần thêm biến ANTHROPIC_API_KEY."
    : c === "rate_limited" ? "Hôm nay đã dùng hết lượt chấm miễn phí. Thử lại vào ngày mai nhé."
    : c === "offline" ? "Mất kết nối tới máy chủ chấm bài. Kiểm tra mạng rồi thử lại."

  let learned = 0, seen = 0;

  return { learned, seen, total: p.words.length };
}

function vocabSession(v, packId) {
  const queue = buildQueueX(packId);
  v.innerHTML = "";
  const back = el('<button class="btn ghost sm" style="margin-bottom:12px">← Thoát buổi ôn</button>');
  back.addEventListener("click", () => go("vocab")); v.appendChild(back);
  if (!queue.length) {
    v.appendChild(el('<div class="card empty"><h3 style="font-size:20px;color:var(--ink)">Xong hết rồi</h3><p>Không còn thẻ nào đến hạn hôm nay. Quay lại vào ngày mai, hoặc mở một chủ đề bất kỳ để học thêm từ mới.</p></div>'));
    return;
  }
  const wrap = el('<div class="flash"></div>');
  const prog = el('<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow" id="fprog"></span><span class="eyebrow" id="fpack"></span></div>');
  wrap.appendChild(prog);
  const card = el('<div class="fcard"></div>'); wrap.appendChild(card);
  const actions = el('<div style="margin-top:14px"></div>'); wrap.appendChild(actions);
  v.appendChild(wrap);

  let i = 0, done = 0, again = [];
  function render() {
    if (i >= queue.length) {
      if (again.length) { queue.push.apply(queue, again); again = []; }
      else {
        card.innerHTML = '<div><div class="word" style="font-size:28px">Hoàn thành</div><p class="muted" style="margin-top:10px">Anh vừa ôn ' + done + " lượt thẻ. Chuỗi ngày học đã được ghi nhận.</p></div>";
        actions.innerHTML = ""; const b = el('<button class="btn primary" style="width:100%">Về danh sách chủ đề</button>');
        b.addEventListener("click", () => go("vocab")); actions.appendChild(b); refreshTags(); return;
      }
    }
    const w = queue[i];
    $("#fprog", prog).textContent = "Thẻ " + (i + 1) + " / " + queue.length;
    $("#fpack", prog).textContent = w.packName + " · band " + fmtBand(w.band);
    card.innerHTML = '<div><div class="word">' + esc(w.w) + '</div><div class="ipa">' + esc(w.ipa) + " · " + esc(w.pos) + "</div></div>";
    actions.innerHTML = "";
    const rowb = el('<div class="row" style="justify-content:center;gap:8px"></div>');
    const say = el('<button class="btn sm">🔊 Nghe</button>');
    say.addEventListener("click", () => speak(w.w));
    const show = el('<button class="btn primary" style="flex:1">Hiện nghĩa</button>');
    show.addEventListener("click", reveal);
    rowb.appendChild(show); rowb.appendChild(say);
    actions.appendChild(rowb);
    actions.appendChild(el('<div class="hint-row"><span><span class="kbd">Space</span> hiện nghĩa</span><span><span class="kbd">S</span> nghe</span></div>'));
    keyMode = "front"; keyReveal = reveal; keyGrade = null;

    function reveal() {
      card.classList.remove("turn"); void card.offsetWidth; card.classList.add("turn");
      card.innerHTML = '<div><div class="word" style="font-size:30px">' + esc(w.w) + '</div><div class="ipa">' + esc(w.ipa) + " · " + esc(w.pos) + '</div>' +
        '<div class="vi">' + esc(w.vi) + '</div><div class="en">' + esc(w.en) + '</div>' +
        '<div class="ex">' + esc(w.ex) + '</div><div class="muted mono" style="font-size:12px;margin-top:10px">' + esc(w.coll) + "</div></div>";
      actions.innerHTML = "";
      const g = el('<div class="grades"></div>');
      [["Lại", "<1 phút", 0], ["Khó", "1 ngày", 1], ["Được", "", 2], ["Dễ", "", 3]].forEach(([lab, hint, gv]) => {
        const c = ST.srs[w.w] || { ivl: 0, ease: 2.4 };
        let nx = hint;
        if (gv === 2) nx = c.ivl ? Math.round(c.ivl * c.ease) + " ngày" : "1 ngày";
        if (gv === 3) nx = c.ivl ? Math.round(c.ivl * c.ease * 1.35) + " ngày" : "3 ngày";
        const b = el('<button class="grade"><b>' + lab + "</b><span>" + nx + "</span></button>");
        b.addEventListener("click", () => { grade(w.w, gv); if (gv === 0) again.push(w); done++; i++; render(); });
        g.appendChild(b);
      });
      actions.appendChild(g);
      actions.appendChild(el('<div class="hint-row"><span><span class="kbd">1</span> Lại</span><span><span class="kbd">2</span> Khó</span><span><span class="kbd">3</span> Được</span><span><span class="kbd">4</span> Dễ</span></div>'));
      keyMode = "back";
      keyGrade = gv => { grade(w.w, gv); if (gv === 0) again.push(w); done++; i++; render(); };
    }
  }

  let keyMode = "front", keyReveal = null, keyGrade = null;
  function onKey(e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (keyMode === "front" && (e.code === "Space" || e.key === "Enter")) { e.preventDefault(); keyReveal && keyReveal(); return; }
    if ((e.key === "s" || e.key === "S") && queue[i]) { e.preventDefault(); speak(queue[i].w, 0.85); return; }
    if (keyMode === "back" && /^[1-4]$/.test(e.key)) { e.preventDefault(); keyGrade && keyGrade(parseInt(e.key, 10) - 1); }
  }
  document.addEventListener("keydown", onKey);
  onLeave(() => document.removeEventListener("keydown", onKey));
  render();
}

function speak(text, rate) {
  try {
    stopAudio();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = rate || 0.95;
    const vs = speechSynthesis.getVoices().filter(x => /en-GB|en_GB|en-US/.test(x.lang));
    if (vs.length) u.voice = vs[0];
    speechSynthesis.speak(u);
  } catch (e) { toast("Trình duyệt này không đọc được tiếng Anh"); }
}

      const row = el('<div class="opts"></div>');

        b.addEventListener("click", () => { answers[i] = o; $$(".opt", row).forEach(x => x.setAttribute("aria-pressed", String(x === b))); });

    } else if (q.type === "mcq") {

      q.options.forEach((o, oi) => {
        const b = el('<button class="opt mc" aria-pressed="false"><b class="mono" style="font-size:11px;color:var(--ink-3)">' + "ABCD"[oi] + "</b>&nbsp; " + esc(o) + "</button>");

        row.appendChild(b);
      });
      box.appendChild(row);
    } else if (q.type === "match") {
      const sel = el("<select></select>");

      q.options.forEach((o, oi) => sel.appendChild(el('<option value="' + oi + '">' + esc(o) + "</option>")));
      sel.addEventListener("change", () => { answers[i] = sel.value === "" ? null : parseInt(sel.value, 10); });

  function check() {
    let correct = 0;
    questions.forEach((q, i) => {
      const box = host.children[i]; if (!box) return;
      $$(".why", box).forEach(x => x.remove());
      let ok = false, shown = "";
      const a = answers[i];
      if (q.type === "tfng" || q.type === "ynng") {
        ok = a === q.a; shown = q.a;
        $$(".opt", box).forEach(b => {

          if (b.textContent.trim() === q.a) b.style.borderColor = "var(--ok)";
          if (b.getAttribute("aria-pressed") === "true" && !ok) { b.style.background = "var(--bad-soft)"; b.style.borderColor = "var(--bad)"; b.style.color = "var(--bad)"; }
        });
      } else if (q.type === "mcq") {
        ok = a === q.a; shown = "ABCD"[q.a] + ". " + q.options[q.a];
        $$(".opt", box).forEach((b, bi) => {
          b.disabled = true;
          if (bi === q.a) b.style.borderColor = "var(--ok)";
          if (bi === a && !ok) { b.style.background = "var(--bad-soft)"; b.style.borderColor = "var(--bad)"; b.style.color = "var(--bad)"; }
        });
      } else if (q.type === "match") {
        ok = a === q.a; shown = q.options[q.a];
        const s = $("select", box); if (s) s.disabled = true;
      } else {
        const list = Array.isArray(q.a) ? q.a : [q.a];
        ok = list.some(x => norm(x) === norm(a));
        shown = list[0];
        const inp = $("input", box);
        if (inp) { inp.disabled = true; inp.style.borderColor = ok ? "var(--ok)" : "var(--bad)"; inp.style.color = ok ? "var(--ok)" : "var(--bad)"; }
      }
      if (ok) correct++;
      box.appendChild(el('<div class="why ' + (ok ? "ok" : "bad") + '">' + (ok ? "<b>Đúng.</b> " : '<b>Đáp án: ' + esc(shown) + ".</b> ") + esc(q.why || "") + "</div>"));

const IPA = window.IPA || {};

const MKC = { y: "vàng · từ mới", g: "xanh · cụm hay", p: "hồng · nghe hụt" };
/* bổ sung từ điển bằng chính bộ từ vựng của app */
const VMAP = {};
V.packs.forEach(pk => pk.words.forEach(w => { VMAP[w.w.toLowerCase()] = [String(w.ipa || "").replace(/\//g, ""), w.vi]; }));

function wordKey(word) { return String(word || "").toLowerCase().replace(/[^a-z'-]/g, "").replace(/^-+|-+$/g, ""); }
function look(word) {
  const k = wordKey(word);
  if (!k) return null;
  const tryK = x => IPA[x] || VMAP[x] || IPA[x.replace(/'s$/, "")] || IPA[x.replace(/s$/, "")] || IPA[x.replace(/es$/, "")] || IPA[x.replace(/ed$/, "")] || IPA[x.replace(/ing$/, "")] || VMAP[x.replace(/s$/, "")] || null;
  let d = tryK(k) || tryK(k.replace(/-/g, ""));
  if (d) return d;
  if (k.indexOf("-") > 0) {
    const parts = k.split("-").filter(Boolean).map(tryK);
    if (parts.length && parts.every(Boolean)) return [parts.map(x => x[0]).join(" "), parts.map(x => x[1]).join(" + ")];
  }
  return null;
}

/* chia câu thành span từ, có đánh số để neo vùng tô sáng */
function wordHTML(text, src, li) {
  const parts = String(text).split(/(\s+)/);
  let wi = -1;
  return parts.map(p => {
    if (/^\s+$/.test(p)) return p;
    if (!/[A-Za-z]/.test(p)) return esc(p);
    wi++;
    return '<span class="w" data-src="' + esc(src) + '" data-li="' + li + '" data-i="' + wi + '">' + esc(p) + "</span>";
  }).join("");
}

function marksFor(src, li) { return (ST.marks[src] || []).filter(m => m.li === li); }

function buildQueueX(packId) {

  if (packId === "book") pool = bw;
  else if (packId) pool = WORDS.filter(w => w.pack === packId);
  else pool = WORDS.concat(bw);
  const due = pool.filter(w => ST.srs[w.w] && ST.srs[w.w].due <= now);
  const fresh = pool.filter(w => !ST.srs[w.w]).slice(0, packId ? 20 : newAllowance());
  const q = due.concat(fresh);
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = q[i]; q[i] = q[j]; q[j] = t; }

/* khớp cụm ghi chú vào chỉ số từ trong câu */
function noteRanges(text, notes) {
  const norm = x => String(x).toLowerCase().replace(/[^a-z']/g, "");
  const toks = text.split(/\s+/).filter(t => /[A-Za-z]/.test(t));
  const out = [];
  (notes || []).forEach(n => {
    const nt = String(n.span).split(/\s+/).filter(t => /[A-Za-z]/.test(t));
    if (!nt.length) return;
    for (let i = 0; i + nt.length <= toks.length; i++) {
      let ok = true;
      for (let j = 0; j < nt.length; j++) if (norm(toks[i + j]) !== norm(nt[j])) { ok = false; break; }
      if (ok) { out.push({ a: i, b: i + nt.length - 1, hint: n.hint, span: n.span }); return; }
    }
  });
  return out;
}

const SER = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];
function wrapLab(lab, x, y) {
  const w = String(lab);
  if (w.length <= 13) return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ink-3)">' + esc(w) + "</text>";
  const parts = w.split(" "); const mid = Math.ceil(parts.length / 2);
  const l1 = parts.slice(0, mid).join(" "), l2 = parts.slice(mid).join(" ");
  return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--ink-3)">' + esc(l1) + '<tspan x="' + x + '" dy="12">' + esc(l2) + "</tspan></text>";
}
const niceMax = m => { const p = Math.pow(10, Math.floor(Math.log10(m || 1))); const s = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]; for (const x of s) if (p * x >= m) return p * x; return p * 10; };

function chartSVG(t) {
  const k = t.kind, c = t.chart;
  if (k === "table") return tableHTML(c, true);
  if (k === "pie") return pieSVG(c, t);
  const W = 640, H = 322, PL = 56, PR = 96, PT = 34, PB = 46;
  const iw = W - PL - PR, ih = H - PT - PB;
  const max = niceMax(Math.max.apply(null, c.series.flatMap(s => s.values)));
  const xs = i => PL + (c.x.length === 1 ? iw / 2 : i * iw / (c.x.length - 1));
  const ys = v => PT + ih - (v / max) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const y = PT + ih - i * ih / 4, val = (max * i / 4);
    g += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (PL + iw) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>';
    g += '<text x="' + (PL - 9) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ink-3)">' + (val >= 10 ? Math.round(val) : val.toFixed(1)) + "</text>";
  }
  c.x.forEach((lab, i) => {
    const x = k === "bar" ? PL + (i + 0.5) * iw / c.x.length : xs(i);
    g += wrapLab(lab, x.toFixed(1), PT + ih + 20);
  });
  if (k === "bar") {
    const bw = iw / c.x.length, n = c.series.length, gw = bw * 0.72, one = (gw - 2 * (n - 1)) / n;
    c.series.forEach((s, si) => s.values.forEach((val, i) => {
      const h = Math.max(1, (val / max) * ih), x = PL + i * bw + (bw - gw) / 2 + si * (one + 2);
      g += '<rect x="' + x.toFixed(1) + '" y="' + (PT + ih - h).toFixed(1) + '" width="' + one.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="' + SER[si % 8] + '"/>';
    }));
  } else {
    c.series.forEach((s, si) => {
      const d = s.values.map((val, i) => (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(val).toFixed(1)).join(" ");
      g += '<path d="' + d + '" fill="none" stroke="' + SER[si % 8] + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      s.values.forEach((val, i) => { g += '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(val).toFixed(1) + '" r="4" fill="' + SER[si % 8] + '" stroke="var(--surface)" stroke-width="2"/>'; });
      const ly = ys(s.values[s.values.length - 1]);
      g += '<circle cx="' + (PL + iw + 12) + '" cy="' + (ly - 3.5).toFixed(1) + '" r="4" fill="' + SER[si % 8] + '"/>';
      g += '<text x="' + (PL + iw + 21) + '" y="' + ly.toFixed(1) + '" font-size="11.5" fill="var(--ink-2)">' + esc(s.name) + "</text>";
    });
  }
  g += '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (PL + iw) + '" y2="' + (PT + ih) + '" stroke="var(--line-2)" stroke-width="1"/>';
  const axis = '<text x="4" y="13" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ink-3)">' + esc(t.yLabel || t.unit || "") + "</text>";
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t.title) + '">' + axis + g + "</svg>" + legendHTML(c.series.map(s => s.name));
}

function pieSVG(c, t) {
  const R0 = 62, cx = 90, cy = 84, W = c.groups.length * 210, H = 190;
  let g = "";
  c.groups.forEach((grp, gi) => {
    const ox = gi * 210;
    let a0 = -Math.PI / 2;
    grp.slices.forEach((s, si) => {
      const a1 = a0 + (s.value / 100) * Math.PI * 2;
      const x0 = ox + cx + R0 * Math.cos(a0), y0 = cy + R0 * Math.sin(a0);
      const x1 = ox + cx + R0 * Math.cos(a1), y1 = cy + R0 * Math.sin(a1);
      const big = (a1 - a0) > Math.PI ? 1 : 0;
      g += '<path d="M ' + (ox + cx) + " " + cy + " L " + x0.toFixed(1) + " " + y0.toFixed(1) + " A " + R0 + " " + R0 + " 0 " + big + " 1 " + x1.toFixed(1) + " " + y1.toFixed(1) + ' Z" fill="' + SER[si % 8] + '" stroke="var(--surface)" stroke-width="2"/>';
      a0 = a1;
    });
    g += '<text x="' + (ox + cx) + '" y="' + (cy + R0 + 26) + '" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">' + esc(grp.title) + "</text>";
  });
  const names = c.groups[0].slices.map(s => s.label);
  return '<svg viewBox="0 0 ' + W + " " + H + '" style="max-width:520px;margin:0 auto" role="img" aria-label="' + esc(t.title) + '">' + g + "</svg>" + legendHTML(names);
}
function legendHTML(names) {
  return '<div class="legend">' + names.map((n, i) => '<span><i style="background:' + SER[i % 8] + '"></i>' + esc(n) + "</span>").join("") + "</div>";
}
function tableHTML(c, plain) {
  const cols = c.cols, rows = c.rows;
  return '<div class="scroll-x"><table class="dtable"><thead><tr>' + cols.map(h => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + r.map(x => "<td>" + esc(x) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
}
function dataTable(t) {
  const c = t.chart;
  if (t.kind === "table") return "";
  if (t.kind === "pie") {
    const names = c.groups[0].slices.map(s => s.label);
    return tableHTML({ cols: [""].concat(c.groups.map(g => g.title + " (%)")), rows: names.map((n, i) => [n].concat(c.groups.map(g => String(g.slices[i].value)))) });
  }
  return tableHTML({ cols: [t.xLabel || ""].concat(c.series.map(s => s.name)), rows: c.x.map((x, i) => [x].concat(c.series.map(s => String(s.values[i])))) });
}

  split.appendChild(main); split.appendChild(side); v.appendChild(split);

  function count() { return (ta.value.trim().match(/\S+/g) || []).length; }
  function upd() {
    const n = count(); $("#wnum", wc).textContent = n + " từ";
    const g = $("#wgoal", wc); g.textContent = n >= minWords ? "đủ độ dài" : "cần " + (minWords - n) + " từ nữa";
    g.style.color = n >= minWords ? "var(--ok)" : "var(--ink-3)";
  }
  ta.addEventListener("input", upd); upd();

  let left_s = minutes * 60, tick = null, run = false;
  const tEl = $("#wtimer", tRow), tBtn = $("#wtoggle", tRow);
  function paintT() { tEl.textContent = String(Math.floor(left_s / 60)).padStart(2, "0") + ":" + String(left_s % 60).padStart(2, "0"); tEl.style.color = left_s < 300 ? "var(--bad)" : "var(--ink)"; }
  tBtn.addEventListener("click", () => {
    run = !run; tBtn.textContent = run ? "Tạm dừng" : "Tiếp tục"; clearInterval(tick);
    if (run) tick = setInterval(() => { left_s--; paintT(); if (left_s <= 0) { clearInterval(tick); toast("Hết giờ — nộp bài thôi"); } }, 1000);
  });
  paintT();

  btnSave.addEventListener("click", () => { ST.writing[item.id] = Object.assign(rec, { text: ta.value, at: Date.now() }); logAct("write"); save(); refreshTags(); toast("Đã lưu nháp"); });
  btnAI.addEventListener("click", async () => {
    const text = ta.value.trim();
    if (count() < 60) return toast("Viết ít nhất 60 từ rồi hãy chấm");
    clearInterval(tick); run = false; tBtn.textContent = "Bấm giờ";
    btnAI.disabled = true; btnAI.innerHTML = '<span class="spin"></span> Đang chấm…';
    out.innerHTML = '<div class="card muted"><span class="spin"></span> Giám khảo AI đang đọc bài…</div>';
    const prompt = buildWritingPrompt(item, task, text);
    try {
      const r = await aiJson(prompt);
      renderFeedback(out, r, "Writing");
      const ov = Number(r.overall) || null;
      ST.writing[item.id] = Object.assign(rec, { text: text, overall: ov, bands: r.bands, at: Date.now() });
      logAct("write"); save(); refreshTags();
    } catch (e) { out.innerHTML = aiErrorHtml(e); }
    btnAI.disabled = false; btnAI.textContent = "Chấm lại bằng AI";
  });
}

function helper(title, items, plain, mono) {
  if (!items || !items.length) return el("<div></div>");
  const c = el('<div class="card"><div class="eyebrow">' + esc(title) + "</div></div>");
  if (mono) { const w = el('<div class="chips" style="margin-top:9px"></div>'); items.forEach(x => w.appendChild(el('<span class="chip">' + esc(x) + "</span>"))); c.appendChild(w); }
  else c.appendChild(el('<ul class="fixlist" style="margin-top:8px">' + items.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>"));
  return c;
}

function buildWritingPrompt(item, task, text) {
  const crit = W.descriptors.criteria.map(c => c.key + " (" + c.name + "): band 6 = " + c.bands["6"] + " | band 7 = " + c.bands["7"] + " | band 8 = " + c.bands["8"]).join("\n");
  return "Bạn là giám khảo IELTS Writing có kinh nghiệm chấm hàng nghìn bài. Chấm bài dưới đây NGHIÊM TÚC và ĐÚNG CHUẨN — không nới tay, không khen xã giao.\n\n" +
    "LOẠI BÀI: Writing Task " + task + (task === 1 ? " (Academic — mô tả số liệu, tối thiểu 150 từ, KHÔNG được nêu ý kiến cá nhân)" : " (essay, tối thiểu 250 từ)") + "\n\n" +
    "ĐỀ BÀI:\n" + (task === 1 ? item.instruction + "\nSố liệu: " + JSON.stringify(item.chart) : item.prompt) + "\n\n" +
    "MÔ TẢ BAND THAM CHIẾU:\n" + crit + "\n\n" +
    "BÀI LÀM CỦA THÍ SINH:\n\"\"\"\n" + text + "\n\"\"\"\n\n" +
    "Trả về DUY NHẤT một object JSON theo đúng schema sau, không kèm chữ nào khác:\n" +
    '{"bands":{"TR":6.5,"CC":6,"LR":6.5,"GRA":6},"overall":6.5,"summary":"2-3 câu tiếng Việt nói thẳng bài này đang ở đâu và rào cản lớn nhất để lên band tiếp theo","strengths":["2-3 điểm mạnh cụ thể, tiếng Việt, có trích dẫn từ bài"],"improvements":[{"issue":"tên lỗi ngắn gọn","why":"vì sao lỗi này kéo band xuống, tiếng Việt","fix":"cách sửa cụ thể, tiếng Việt"}],"corrections":[{"original":"câu nguyên văn LẤY TỪ BÀI","better":"câu đã sửa bằng tiếng Anh","note":"giải thích ngắn bằng tiếng Việt"}],"nextSteps":["2-3 việc cụ thể nên làm trước bài viết sau, tiếng Việt"]}\n' +
    "Quy tắc: band là bội số của 0.5 trong khoảng 4.0–9.0; overall = trung bình 4 tiêu chí làm tròn về 0.5. improvements có 3–4 mục. corrections có 4–6 câu và ORIGINAL PHẢI xuất hiện nguyên văn trong bài làm. Nhận xét bằng tiếng Việt, câu tiếng Anh giữ nguyên tiếng Anh.";
}

function renderFeedback(out, r, kind) {
  out.innerHTML = "";
  const ov = Number(r.overall);
  const head2 = el('<div class="card" style="margin-bottom:12px"><div class="row" style="align-items:flex-start;gap:18px"></div></div>');
  const rw = $(".row", head2);
  rw.appendChild(el('<div style="text-align:center;flex:none"><div class="eyebrow">Band ' + kind + '</div><div class="mono" style="font-size:44px;font-weight:600;line-height:1.1;color:' + bandColor(ov) + '">' + fmtBand(ov) + "</div></div>"));
  rw.appendChild(el('<div style="flex:1;min-width:220px"><p style="margin:0;font-size:14.5px">' + esc(r.summary || "") + "</p></div>"));
  out.appendChild(head2);

  const grid = el('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:12px"></div>');
  const desc = (kind === "Writing" ? W : S).descriptors.criteria;
  desc.forEach(c => {
    const b = r.bands ? r.bands[c.key] : null;
    grid.appendChild(el('<div class="crit"><h4>' + esc(c.nameVi) + '<span class="bandv" style="color:' + bandColor(b) + '">' + fmtBand(b) + "</span></h4><p>" + esc((c.bands[String(Math.floor(b || 6))] || "").slice(0, 150)) + "</p></div>"));
  });
  out.appendChild(grid);

  if (r.strengths && r.strengths.length) out.appendChild(el('<div class="card" style="margin-bottom:12px"><div class="eyebrow" style="color:var(--ok)">Đang làm tốt</div><ul class="fixlist" style="margin-top:8px">' + r.strengths.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>"));
  if (r.improvements && r.improvements.length) {
    const c = el('<div class="card" style="margin-bottom:12px"><div class="eyebrow" style="color:var(--warn)">Chỗ đang mất band</div></div>');
    r.improvements.forEach(i => c.appendChild(el('<div style="margin-top:11px"><b style="font-size:14.5px">' + esc(i.issue) + '</b><p style="margin:3px 0 0;font-size:13.5px;color:var(--ink-2)">' + esc(i.why) + '</p><p style="margin:3px 0 0;font-size:13.5px"><b>Cách sửa:</b> ' + esc(i.fix) + "</p></div>")));
    out.appendChild(c);
  }
  if (r.corrections && r.corrections.length) {
    const c = el('<div class="card" style="margin-bottom:12px"><div class="eyebrow">Sửa thẳng vào câu của anh</div></div>');
    r.corrections.forEach(x => c.appendChild(el('<div style="margin-top:12px;padding-left:11px;border-left:2px solid var(--line-2)"><div class="diff-old" style="font-family:Newsreader,serif;font-size:15px">' + esc(x.original) + '</div><div class="diff-new" style="font-family:Newsreader,serif;font-size:15.5px;margin-top:3px">' + esc(x.better) + '</div><div class="muted" style="font-size:12.5px;margin-top:3px">' + esc(x.note) + "</div></div>")));
    out.appendChild(c);
  }
  if (r.nextSteps && r.nextSteps.length) out.appendChild(el('<div class="card"><div class="eyebrow" style="color:var(--accent)">Làm gì tiếp theo</div><ul class="fixlist" style="margin-top:8px">' + r.nextSteps.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>"));
}

function cueSession(v, card) {
  v.innerHTML = "";
  const back = el('<button class="btn ghost sm" style="margin-bottom:12px">← Danh sách cue card</button>');
  back.addEventListener("click", () => go("speaking")); v.appendChild(back);
  const rec = ST.speaking[card.id] || {};

  const split = el('<div class="split"></div>');
  const main = el("<div></div>"), side = el('<div class="grid"></div>');

  const cue = el('<div class="cue" style="margin-bottom:14px"><div class="eyebrow">Part 2 · Long turn</div><h3>' + esc(card.cue) + "</h3><ul>" +
    card.bullets.map(b => "<li>" + esc(b) + "</li>").join("") + "</ul></div>");
  main.appendChild(cue);

  const stage = el('<div class="card" style="margin-bottom:14px;text-align:center"></div>');
  const label = el('<div class="eyebrow">Sẵn sàng</div>');
  const big = el('<div class="bigtimer">1:00</div>');
  const hint = el('<p class="muted" style="font-size:13px;margin:8px 0 14px">1 phút ghi ý ra giấy, sau đó nói liên tục 2 phút. Đừng dừng giữa chừng — trôi chảy tính điểm cao hơn nói hay mà ngắt quãng.</p>');
  const btn = el('<button class="btn primary">Bắt đầu 1 phút chuẩn bị</button>');
  stage.appendChild(label); stage.appendChild(big); stage.appendChild(hint); stage.appendChild(btn);
  main.appendChild(stage);

  let phase = 0, t = 60, tick = null;
  function paint() { big.textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); big.style.color = t <= 10 ? "var(--bad)" : "var(--ink)"; }
  function run(secs, name, next) {
    clearInterval(tick); t = secs; label.textContent = name; paint();
    tick = setInterval(() => { t--; paint(); if (t <= 0) { clearInterval(tick); next(); } }, 1000);
  }
  btn.addEventListener("click", () => {
    if (phase === 0) {
      phase = 1; btn.textContent = "Bỏ qua, nói luôn";
      run(60, "Đang chuẩn bị", () => startSpeak());
    } else if (phase === 1) { startSpeak(); }
    else { clearInterval(tick); phase = 0; btn.textContent = "Bắt đầu 1 phút chuẩn bị"; label.textContent = "Sẵn sàng"; t = 60; paint(); }
  });
  function startSpeak() {
    phase = 2; btn.textContent = "Dừng"; hint.textContent = "Nói to, đủ 2 phút. Bám 4 gạch đầu dòng trên cue card theo thứ tự.";
    try { speak("You have two minutes. Please start speaking now.", 1); } catch (e) { }
    run(120, "Đang nói", () => { phase = 0; btn.textContent = "Nói lại"; label.textContent = "Hết 2 phút"; toast("Hết giờ — giờ gõ lại ý anh vừa nói để chấm"); });
  }

  const noteCard = el('<div class="card"><div class="eyebrow">Gõ lại phần anh vừa nói</div><p class="muted" style="font-size:12.5px;margin:6px 0 10px">Gõ càng sát lời nói càng chấm chuẩn. Chưa quen thì gõ dàn ý câu — AI vẫn nhận xét được vốn từ và ngữ pháp.</p></div>');
  const ta = el('<textarea rows="10" placeholder="Well, the place I would like to talk about is…" spellcheck="false"></textarea>');
  ta.value = rec.notes || "";
  const acts = el('<div class="row" style="margin-top:12px"></div>');
  const btnAI = el('<button class="btn primary">Chấm phần nói bằng AI</button>');
  const btnMic = el('<button class="btn">🎙 Thử chép lời tự động</button>');
  acts.appendChild(btnAI); acts.appendChild(btnMic);
  noteCard.appendChild(ta); noteCard.appendChild(acts);
  main.appendChild(noteCard);
  const out = el('<div style="margin-top:14px"></div>'); main.appendChild(out);

  side.appendChild(helper("Ý tưởng có thể dùng", card.ideas));
  side.appendChild(helper("Cụm từ ghi điểm", card.lang, false, true));
  const p3 = el('<div class="card"><div class="eyebrow">Part 3 · Hỏi sâu</div><p class="muted" style="font-size:12.5px;margin:6px 0 10px">Trả lời dài 3–4 câu, có lý do và ví dụ.</p></div>');
  card.part3.forEach(q => {
    const r = el('<div class="row" style="gap:8px;align-items:flex-start;margin-bottom:9px"><button class="btn sm ghost" style="flex:none;padding:2px 7px">🔊</button><span style="flex:1;min-width:0;font-family:Newsreader,serif;font-size:15px">' + esc(q) + "</span></div>");
    $("button", r).addEventListener("click", () => speak(q, 0.95));
    p3.appendChild(r);
  });
  side.appendChild(p3);
  split.appendChild(main); split.appendChild(side); v.appendChild(split);

  /* chép lời tự động */
  let sr = null;
  btnMic.addEventListener("click", () => {
    const SRC = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SRC) return toast("Trình duyệt này không hỗ trợ chép lời tự động — anh gõ tay nhé");
    if (sr) { try { sr.stop(); } catch (e) { } sr = null; btnMic.textContent = "🎙 Thử chép lời tự động"; return; }
    try {
      sr = new SRC(); sr.lang = "en-GB"; sr.continuous = true; sr.interimResults = false;
      sr.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) ta.value += (ta.value ? " " : "") + e.results[i][0].transcript; };
      sr.onerror = () => { toast("Không truy cập được micro ở đây — anh gõ tay nhé"); sr = null; btnMic.textContent = "🎙 Thử chép lời tự động"; };
      sr.onend = () => { sr = null; btnMic.textContent = "🎙 Thử chép lời tự động"; };
      sr.start(); btnMic.textContent = "⏹ Dừng chép lời";
    } catch (e) { toast("Không bật được micro trong khung này — anh gõ tay nhé"); sr = null; }
  });

  btnAI.addEventListener("click", async () => {
    const text = ta.value.trim();
    if ((text.match(/\S+/g) || []).length < 40) return toast("Gõ ít nhất 40 từ rồi hãy chấm");
    if (sr) { try { sr.stop(); } catch (e) { } }
    btnAI.disabled = true; btnAI.innerHTML = '<span class="spin"></span> Đang chấm…';
    out.innerHTML = '<div class="card muted"><span class="spin"></span> Giám khảo AI đang nghe lại phần nói…</div>';
    const crit = S.descriptors.criteria.map(c => c.key + " (" + c.name + "): band 6 = " + c.bands["6"] + " | band 7 = " + c.bands["7"] + " | band 8 = " + c.bands["8"]).join("\n");
    const prompt = "Bạn là giám khảo IELTS Speaking. Dưới đây là bản gõ lại phần trả lời Part 2 của thí sinh (không có âm thanh, nên với tiêu chí Pronunciation hãy chấm dè dặt và nói rõ giới hạn đó trong nhận xét).\n\n" +
      "CUE CARD:\n" + card.cue + "\n" + card.bullets.map(b => "- " + b).join("\n") + "\n\n" +
      "MÔ TẢ BAND THAM CHIẾU:\n" + crit + "\n\n" +
      "PHẦN NÓI CỦA THÍ SINH:\n\"\"\"\n" + text + "\n\"\"\"\n\n" +
      "Trả về DUY NHẤT một object JSON:\n" +
      '{"bands":{"FC":6.5,"LR":6,"GRA":6,"PRON":6},"overall":6,"summary":"2-3 câu tiếng Việt","strengths":["..."],"improvements":[{"issue":"...","why":"...","fix":"..."}],"corrections":[{"original":"câu lấy nguyên văn từ phần nói","better":"câu tiếng Anh tự nhiên hơn","note":"giải thích tiếng Việt"}],"nextSteps":["..."]}\n' +
      "Quy tắc: khoá bands PHẢI đúng là " + S.descriptors.criteria.map(c => c.key).join(", ") + ". Band là bội số 0.5 trong 4.0–9.0. corrections 4–6 câu, original lấy nguyên văn từ phần nói. Nhận xét tiếng Việt, câu tiếng Anh giữ tiếng Anh. Chấm nghiêm, chỉ ra chỗ lặp từ và câu quá đơn giản.";
    try {
      const r = await aiJson(prompt);
      renderFeedback(out, r, "Speaking");
      ST.speaking[card.id] = { notes: text, overall: Number(r.overall) || null, bands: r.bands, at: Date.now() };
      logAct("speak"); save(); refreshTags();
    } catch (e) { out.innerHTML = aiErrorHtml(e); }
    btnAI.disabled = false; btnAI.textContent = "Chấm lại bằng AI";
  });
}

function keepSession(j) {
  if (!j || !j.access_token) throw new Error("Máy chủ không trả về phiên đăng nhập.");
  authSave({ access_token: j.access_token, refresh_token: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000, user: { id: j.user.id, email: j.user.email } });
}
async function ensureToken() {
  if (!AUTH) return false;
  if (Date.now() < AUTH.exp) return true;
  try { keepSession(await sbAuth("token?grant_type=refresh_token", { refresh_token: AUTH.refresh_token })); return true; }
  catch (e) { authSave(null); return false; }
}

/* ---------- gộp tiến độ hai máy ---------- */
function mergeState(a, b) {
  if (!b || typeof b !== "object") return a;
  const newer = (b.savedAt || 0) > (a.savedAt || 0) ? b : a;
  const out = Object.assign({}, a);
  out.name = newer.name || a.name || b.name || "";
  out.target = newer.target || a.target || 7;
  out.rate = newer.rate || a.rate || 1;
  out.onboarded = !!(a.onboarded || b.onboarded);

  out.srs = Object.assign({}, a.srs);
  const bs = b.srs || {};
  for (const k in bs) {
    const x = out.srs[k], y = bs[k];
    if (!x || (y.reps || 0) > (x.reps || 0) || ((y.reps || 0) === (x.reps || 0) && (y.due || 0) > (x.due || 0))) out.srs[k] = y;
  }
  ["reading", "listening"].forEach(f => {
    out[f] = Object.assign({}, a[f]);
    const src = b[f] || {};
    for (const k in src) {
      const x = out[f][k], y = src[k];
      out[f][k] = !x ? y : {
        best: Math.max(x.best || 0, y.best || 0),
        attempts: Math.max(x.attempts || 0, y.attempts || 0),
        last: (y.at || 0) > (x.at || 0) ? y.last : x.last,
        at: Math.max(x.at || 0, y.at || 0)
      };
    }
  });
  ["writing", "speaking"].forEach(f => {
    out[f] = Object.assign({}, a[f]);
    const src = b[f] || {};
    for (const k in src) { const x = out[f][k], y = src[k]; if (!x || (y.at || 0) > (x.at || 0)) out[f][k] = y; }
  });
  out.days = Object.assign({}, a.days);
  const bd = b.days || {};
  for (const k in bd) {
    const x = out.days[k], y = bd[k];
    out.days[k] = !x ? y : { cards: Math.max(x.cards || 0, y.cards || 0), acts: Math.max(x.acts || 0, y.acts || 0) };
  }
  const an = a.newToday || { d: "", n: 0 }, bn = b.newToday || { d: "", n: 0 };
  out.newToday = an.d === bn.d ? { d: an.d, n: Math.max(an.n || 0, bn.n || 0) } : (bn.d === dayKey() ? bn : an);
  out.savedAt = Date.now();
  return out;
}

/* ---------- kéo / đẩy ---------- */
async function cloudPull() {
  if (!SB_ON || !await ensureToken()) return null;
  const r = await fetch(SB_URL + "/rest/v1/progress?select=data&user_id=eq." + AUTH.user.id, { headers: sbHeaders(true) });
  if (!r.ok) throw new Error("Không tải được tiến độ (" + r.status + ")");
  const rows = await r.json();
  return rows && rows[0] ? rows[0].data : {};
}
async function cloudPush() {
  if (!SB_ON || !await ensureToken()) return;
  const r = await fetch(SB_URL + "/rest/v1/progress", {
    method: "POST",
    headers: Object.assign(sbHeaders(true), { Prefer: "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify({ user_id: AUTH.user.id, data: ST, updated_at: new Date().toISOString() })
  });
  if (!r.ok) throw new Error("Không lưu được lên đám mây (" + r.status + ")");
}
function schedulePush() {
  if (!SB_ON || !AUTH) return;
  clearTimeout(pushT);
  pushT = setTimeout(async () => {
    setSync("syncing");
    try { await cloudPush(); setSync("idle"); } catch (e) { setSync("error"); }
  }, 2500);
}
async function cloudSyncNow() {
  if (!SB_ON || !AUTH) return;
  setSync("syncing");
  try {
    const remote = await cloudPull();
    if (remote && Object.keys(remote).length) { ST = mergeState(ST, remote); save(); }
    await cloudPush();
    setSync("idle");
  } catch (e) { setSync("error"); }
}

/* ---------- giao diện ---------- */
function setSync(s) {
  syncState = s;
  const b = $("#btnAccount"); if (!b) return;
  const label = $("span", b);
  const dot = { syncing: "…", idle: "✓", error: "!", guest: "", off: "" }[s] || "";
  if (AUTH) label.textContent = (AUTH.user.email || "").split("@")[0] + (dot ? " " + dot : "");
  else label.textContent = SB_ON ? "Đăng nhập" : "Chỉ lưu máy này";
  b.title = s === "error" ? "Chưa đồng bộ được — sẽ thử lại khi anh học tiếp" : s === "idle" ? "Đã đồng bộ" : "";
}

function accountDialog() {
  const d = $("#dlgAccount"); if (!d) return;
  const host = $("#accBody"); host.innerHTML = "";
  if (!SB_ON) {
    host.appendChild(el('<p class="muted" style="font-size:13.5px;margin:0">Bản này chưa nối máy chủ tài khoản, nên tiến độ chỉ nằm trên thiết bị đang dùng. Bản đặt trên tên miền riêng có đăng ký tài khoản và học tiếp được ở máy khác.</p>'));
    d.showModal(); return;
  }
  if (AUTH) {
    host.appendChild(el('<div><div class="eyebrow">Đang đăng nhập</div><p style="margin:6px 0 0;font-size:15px;font-weight:600">' + esc(AUTH.user.email) + '</p>' +
      '<p class="muted" style="font-size:13px;margin:6px 0 0">Tiến độ được đẩy lên đám mây vài giây sau mỗi lần học. Mở app trên máy khác rồi đăng nhập là học tiếp được ngay.</p></div>'));
    const row = el('<div class="row" style="margin-top:16px;justify-content:space-between"></div>');
    const sync = el('<button class="btn">Đồng bộ ngay</button>');
    sync.addEventListener("click", async () => { sync.disabled = true; sync.innerHTML = '<span class="spin"></span> Đang đồng bộ'; await cloudSyncNow(); sync.disabled = false; sync.textContent = "Đồng bộ ngay"; toast(syncState === "idle" ? "Đã đồng bộ" : "Đồng bộ thất bại"); go(CUR); });
    const out = el('<button class="btn ghost">Đăng xuất</button>');
    out.addEventListener("click", () => { authSave(null); setSync("guest"); d.close(); toast("Đã đăng xuất — tiến độ vẫn còn trên máy này"); go(CUR); });
    row.appendChild(sync); row.appendChild(out);
    host.appendChild(row);
    d.showModal(); return;
  }

  let mode = "in";
  function form() {
    host.innerHTML = "";
    host.appendChild(el('<p class="muted" style="font-size:13.5px;margin:0 0 14px">' +
      (mode === "in" ? "Đăng nhập để tiến độ theo anh sang máy khác." : "Tạo tài khoản mới — chỉ cần email và mật khẩu, không phải xác nhận email.") + "</p>"));
    const em = el('<input type="text" id="accEmail" placeholder="email" autocomplete="email" style="width:100%">');
    const pw = el('<input type="password" id="accPw" placeholder="mật khẩu (ít nhất 6 ký tự)" autocomplete="current-password" style="width:100%;margin-top:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px">');
    const err = el('<p style="color:var(--bad);font-size:13px;margin:10px 0 0" hidden></p>');
    const go2 = el('<button class="btn primary" style="width:100%;margin-top:14px">' + (mode === "in" ? "Đăng nhập" : "Tạo tài khoản") + "</button>");
    const swap = el('<button class="btn ghost sm" style="width:100%;margin-top:8px">' + (mode === "in" ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập") + "</button>");
    swap.addEventListener("click", () => { mode = mode === "in" ? "up" : "in"; form(); });
    async function submit() {
      const email = em.value.trim(), pass = pw.value;
      err.hidden = true;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "Email chưa đúng định dạng."; err.hidden = false; return; }
      if (pass.length < 6) { err.textContent = "Mật khẩu cần ít nhất 6 ký tự."; err.hidden = false; return; }
      go2.disabled = true; go2.innerHTML = '<span class="spin"></span> Đang xử lý…';
      try {
        const j = mode === "in"
          ? await sbAuth("token?grant_type=password", { email: email, password: pass })
          : await sbAuth("signup", { email: email, password: pass });
        keepSession(j);
        await cloudSyncNow();
        $("#dlgAccount").close();
        toast("Xin chào " + email.split("@")[0]);
        go("home");
      } catch (e) {
        const m = String(e.message || "");
        err.textContent = /invalid login/i.test(m) ? "Email hoặc mật khẩu không đúng."
          : /already registered|already been registered/i.test(m) ? "Email này đã có tài khoản — chuyển sang đăng nhập nhé."
            : /Password/i.test(m) ? "Mật khẩu quá ngắn hoặc quá yếu."
              : m || "Không kết nối được máy chủ.";
        err.hidden = false;
        go2.disabled = false; go2.textContent = mode === "in" ? "Đăng nhập" : "Tạo tài khoản";
      }
    }
    go2.addEventListener("click", submit);
    pw.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    host.appendChild(em); host.appendChild(pw); host.appendChild(err); host.appendChild(go2); host.appendChild(swap);
  }
  form();
  d.showModal();
}

async function cloudBoot() {
  if (!SB_ON) { setSync("off"); return; }
  if (AUTH && await ensureToken()) { setSync("idle"); await cloudSyncNow(); go(CUR); }
  else { authSave(null); setSync("guest"); }
}
/* ============ Sổ tay ============ */
function bookWords() {
  return Object.keys(ST.book).map(k => {
    const b = ST.book[k];
    return { w: k, ipa: b.ipa || "", vi: b.vi || "", en: "", ex: "", coll: b.src ? "gặp trong: " + b.src : "", band: 0, pack: "book", packName: "Sổ tay" };
  });
}
function srcTitle(src) {
  const r = R.passages.find(p => p.id === src); if (r) return { t: r.title, go: () => go("reading", src) };
  const l = L.sections.find(p => p.id === src); if (l) return { t: "Part " + l.part + " · " + l.title, go: () => go("listening", src) };
  return { t: src, go: null };
}
function allMarks() {
  const out = [];
  Object.keys(ST.marks).forEach(src => (ST.marks[src] || []).forEach(m => out.push({ src: src, m: m })));
  return out.sort((a, b) => (b.m.at || 0) - (a.m.at || 0));
}

ROUTES.book = function (v, arg) {
  const words = bookWords(), marks = allMarks();
  v.appendChild(el(head("Sổ tay", 'Mọi từ anh bấm lưu và mọi chỗ anh tô trong bài đều rơi về đây. Đây là <span class="mark">bộ đề của riêng anh</span> — ôn cái mình từng vấp mới lên band nhanh.')));

  const bar = el('<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"></div></div>');
  const rw = $(".row", bar);
  rw.appendChild(el('<div><div class="eyebrow">Đang có</div><div style="font-size:15px;margin-top:2px"><b class="mono" style="font-size:22px">' + words.length + '</b> từ đã lưu · <b class="mono">' + marks.length + '</b> chỗ đã tô</div></div>'));
  if (words.length) {
    const b = el('<button class="btn primary">Luyện thẻ từ sổ tay</button>');
    b.addEventListener("click", () => vocabSession($("#view"), "book"));
    rw.appendChild(b);
  }
  v.appendChild(bar);

  const tabs = el('<div class="tabs"><button class="tab" aria-selected="true" data-t="w">Từ đã lưu</button><button class="tab" data-t="m">Câu &amp; cụm đã tô</button></div>');
  v.appendChild(tabs);
  const host = el("<div></div>"); v.appendChild(host);

  function paint(t) {
    $$(".tab", tabs).forEach(b => b.setAttribute("aria-selected", String(b.dataset.t === t)));
    host.innerHTML = "";
    if (t === "w") {
      if (!words.length) { host.appendChild(el('<div class="card empty"><h3 style="font-size:19px;color:var(--ink)">Sổ từ còn trống</h3><p>Mở một bài Reading hay transcript bài nghe, bấm vào từ nào chưa chắc rồi chọn “+ Sổ từ”. Từ đó sẽ vào đây và vào luôn bộ thẻ ôn.</p></div>')); return; }
      const wrap = el('<div class="card scroll-x" style="padding:6px 0"></div>');
      const tb = el('<table class="vtable"><thead><tr><th>Từ</th><th>Phiên âm</th><th>Nghĩa</th><th>Nguồn</th><th>Trạng thái</th><th></th></tr></thead><tbody></tbody></table>');
      const body = $("tbody", tb);
      words.sort((a, b) => (ST.book[b.w].at || 0) - (ST.book[a.w].at || 0)).forEach(w => {
        const c = ST.srs[w.w];
        const stt = !c ? '<span class="pill">chưa học</span>' : c.ivl >= 7 ? '<span class="pill ok">thuộc</span>' : c.due <= Date.now() ? '<span class="pill warn">đến hạn</span>' : '<span class="pill acc">' + Math.ceil((c.due - Date.now()) / DAY) + "n nữa</span>";
        const src = ST.book[w.w].src ? srcTitle(ST.book[w.w].src).t : "—";
        const tr = el("<tr><td><b>" + esc(w.w) + '</b></td><td class="mono" style="color:var(--accent);font-size:12.5px">' + esc(w.ipa) + "</td><td>" + esc(w.vi) + '</td><td class="muted" style="font-size:12.5px">' + esc(src) + "</td><td>" + stt + '</td><td style="white-space:nowrap"><button class="btn sm ghost" data-a="say">🔊</button> <button class="btn sm ghost" data-a="del">✕</button></td></tr>');
        $('[data-a="say"]', tr).addEventListener("click", () => speak(w.w, 0.85));
        $('[data-a="del"]', tr).addEventListener("click", () => { delete ST.book[w.w]; save(); refreshTags(); go("book"); });
        body.appendChild(tr);
      });
      wrap.appendChild(tb); host.appendChild(wrap);
      const exp = el('<div class="row" style="margin-top:12px"><button class="btn sm">Sao chép cả sổ từ</button></div>');
      $("button", exp).addEventListener("click", () => {
        const txt = words.map(w => w.w + "\t" + w.ipa + "\t" + w.vi).join("\n");
        (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Đã sao chép " + words.length + " từ")).catch(() => toast("Trình duyệt chặn sao chép"));
      });
      host.appendChild(exp);
      return;
    }
    if (!marks.length) { host.appendChild(el('<div class="card empty"><h3 style="font-size:19px;color:var(--ink)">Chưa tô chỗ nào</h3><p>Trong bài đọc hoặc transcript, bôi đen một cụm rồi chọn màu: vàng cho từ mới, xanh cho cụm đáng học thuộc, hồng cho chỗ nghe hụt.</p></div>')); return; }
    const bySrc = {};
    marks.forEach(x => (bySrc[x.src] = bySrc[x.src] || []).push(x.m));
    const g = el('<div class="grid"></div>');
    Object.keys(bySrc).forEach(src => {
      const info = srcTitle(src);
      const card = el('<div class="bk"></div>');
      const hd = el('<div class="srcrow"><div><div class="eyebrow">' + (R.passages.some(p => p.id === src) ? "Reading" : "Listening") + '</div><b style="font-size:15px">' + esc(info.t) + "</b></div></div>");
      if (info.go) { const b = el('<button class="btn sm">Mở bài</button>'); b.addEventListener("click", info.go); hd.appendChild(b); }
      card.appendChild(hd);
      bySrc[src].forEach(m => {
        const txt = markText(src, m);
        const row = el('<div class="row" style="align-items:flex-start;gap:8px;margin-top:8px"><div class="mkline" style="flex:1;min-width:0"><em class="mk-' + m.c + '">' + esc(txt || "(đoạn đã tô)") + "</em></div></div>");
        const say = el('<button class="btn sm ghost" style="flex:none">🔊</button>');
        say.addEventListener("click", () => speak(txt, 0.9));
        const del = el('<button class="btn sm ghost" style="flex:none">✕</button>');
        del.addEventListener("click", () => { dropMark(src, m.li, m.a); go("book"); });
        row.appendChild(say); row.appendChild(del);
        card.appendChild(row);
      });
      g.appendChild(card);
    });
    host.appendChild(g);
  }
  $$(".tab", tabs).forEach(b => b.addEventListener("click", () => paint(b.dataset.t)));
  paint(arg === "marks" ? "m" : "w");
};
/* ---------- start ---------- */
refreshTags();
setSync(SB_ON ? (AUTH ? "idle" : "guest") : "off");
go("home");
if (!ST.onboarded && !AUTH) welcome();
cloudBoot();
</script>
