<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="App luyện IELTS 4 kỹ năng: 200 từ vựng flashcard lặp lại ngắt quãng, 4 bài Reading, 4 phần Listening, ngân hàng đề Writing và Speaking kèm chấm AI theo band descriptors.">
<meta name="theme-color" content="#0B5D57">
<meta property="og:title" content="Sổ Luyện IELTS">
<meta property="og:description" content="Luyện đủ 4 kỹ năng IELTS, chấm Writing và Speaking bằng AI. Miễn phí, không cần đăng ký.">
<meta property="og:type" content="website">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sổ Luyện IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#E9ECEA; --surface:#FCFDFC; --surface-2:#F1F4F2; --sunk:#E2E7E4;
  --ink:#12201F; --ink-2:#41524F; --ink-3:#6B7B78; --line:#D3DAD7; --line-2:#C0CAC6;
  --accent:#0B5D57; --accent-soft:#DCEAE8; --accent-ink:#FFFFFF;
  --hl:#F5D547; --hl-soft:#FBEFB4;
  --mk-y:#FBEBA0; --mk-g:#C7E9D3; --mk-p:#F6D2DE;
  --ok:#1F7A4D; --ok-soft:#DDEFE4; --bad:#BE3A2C; --bad-soft:#F7E0DC; --warn:#B9741A; --warn-soft:#F6E7CE;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 1px 2px rgba(18,32,31,.05), 0 8px 24px -18px rgba(18,32,31,.35);
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#0E1614; --surface:#16211F; --surface-2:#1C2926; --sunk:#101A18;
  --ink:#E8EFEC; --ink-2:#AFC0BC; --ink-3:#7E908C; --line:#273532; --line-2:#33443F;
  --accent:#3FA79C; --accent-soft:#17302E; --accent-ink:#08201E;
  --hl:#E5C64A; --hl-soft:#3A3620;
  --mk-y:#5A4E1E; --mk-g:#1F4433; --mk-p:#4A2733;
  --ok:#4FB27C; --ok-soft:#16301F; --bad:#E17A6C; --bad-soft:#331A16; --warn:#D9A055; --warn-soft:#332614;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0E1614; --surface:#16211F; --surface-2:#1C2926; --sunk:#101A18;
  --ink:#E8EFEC; --ink-2:#AFC0BC; --ink-3:#7E908C; --line:#273532; --line-2:#33443F;
  --accent:#3FA79C; --accent-soft:#17302E; --accent-ink:#08201E;
  --hl:#E5C64A; --hl-soft:#3A3620;
  --mk-y:#5A4E1E; --mk-g:#1F4433; --mk-p:#4A2733;
  --ok:#4FB27C; --ok-soft:#16301F; --bad:#E17A6C; --bad-soft:#331A16; --warn:#D9A055; --warn-soft:#332614;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.mark{background:linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 94%, transparent 94%);padding:0 .1em}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;flex:none}
.brand b{font-family:Newsreader,serif;font-size:17px;font-weight:600;line-height:1.1;display:block}
.brand span{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-align:left;font-size:14px;font-weight:500}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn .tag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.navbtn[aria-current="true"] .tag{color:var(--accent)}
.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.main{padding:34px 34px 80px;max-width:1160px;width:100%}
.page-head{margin-bottom:24px}
.page-head h1{font-size:31px}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.muted{color:var(--ink-3)}
.sep{height:1px;background:var(--line);margin:14px 0}
select,input[type=text],input[type=password],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
textarea{width:100%;resize:vertical;line-height:1.7}
.scroll-x{overflow-x:auto}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.dials{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dial{text-align:center}
.dial svg{display:block;margin:0 auto}
.dial .v{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.dial .k{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.02em}
.overall{display:flex;align-items:baseline;gap:8px}
.overall b{font-family:"IBM Plex Mono",monospace;font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em}
.streak{display:flex;flex-direction:column;justify-content:space-between}
.streak-num{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;line-height:1}
.weekdots{display:flex;gap:5px;margin-top:10px}
.weekdots i{width:100%;height:26px;border-radius:5px;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.weekdots i.on{background:var(--hl);color:#12201F}
.tasks{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left;width:100%}
.task:hover{border-color:var(--accent);background:var(--accent-soft)}
.task .n{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);flex:none}
.task:hover .n{background:var(--accent);color:var(--accent-ink)}
.task .t{font-weight:600;font-size:14px}
.task .d{font-size:12.5px;color:var(--ink-3)}
.task .arr{margin-left:auto;color:var(--ink-3)}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wk{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface)}
.wk h4{font-size:14px;margin-bottom:4px}
.wk p{margin:0;font-size:12.5px;color:var(--ink-2)}

/* ---------- vocab ---------- */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.pack{border:1px solid var(--line);border-radius:9px;padding:13px 14px;background:var(--surface);text-align:left}
.pack:hover{border-color:var(--accent)}
.pack h4{font-size:15px}
.pack .bar{height:5px;border-radius:99px;background:var(--sunk);margin-top:9px;overflow:hidden}
.pack .bar i{display:block;height:100%;background:var(--accent)}
.pack .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:6px;font-family:"IBM Plex Mono",monospace}
.flash{max-width:620px;margin:0 auto}
.fcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:30px 26px;min-height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.fcard .word{font-family:Newsreader,serif;font-size:38px;font-weight:600;line-height:1.15}
.fcard .ipa{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);font-size:13px;margin-top:4px}
.fcard .vi{font-size:20px;color:var(--accent);font-weight:600;margin-top:14px}
.fcard .en{color:var(--ink-2);margin-top:8px;font-size:14.5px}
.fcard .ex{font-family:Newsreader,serif;font-style:italic;font-size:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade{border:1px solid var(--line-2);border-radius:9px;padding:9px 6px;background:var(--surface);text-align:center}
.grade b{display:block;font-size:13.5px}
.grade span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.grade:hover{border-color:var(--accent);background:var(--accent-soft)}
.vtable{width:100%;border-collapse:collapse;font-size:14px}
.vtable th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line)}
.vtable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable tr:hover td{background:var(--surface-2)}

/* ---------- booklet (reading / listening) ---------- */
.booklet{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;max-height:calc(100vh - 150px);overflow-y:auto}
.passage h2{font-size:25px;margin-bottom:4px}
.passage .para{display:flex;gap:14px;margin-top:15px}
.passage .para .lab{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent);flex:none;width:16px;padding-top:2px}
.passage .para p{margin:0;font-family:Newsreader,serif;font-size:16.5px;line-height:1.68}
.answers{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;max-height:calc(100vh - 150px);overflow-y:auto}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .qh{display:flex;gap:9px;align-items:flex-start}
.q .qn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);flex:none;width:20px;padding-top:2px}
.q .qt{font-size:14.5px;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 29px}
.opt{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:5px 11px;font-size:13.5px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.opt.mc{display:block;width:100%;text-align:left}
.q input[type=text]{margin:9px 0 0 29px;width:calc(100% - 29px);font-family:"IBM Plex Mono",monospace;font-size:13.5px}
.q select{margin:9px 0 0 29px;width:calc(100% - 29px)}
.why{margin:9px 0 0 29px;font-size:13px;padding:9px 11px;border-radius:7px;background:var(--surface-2);border-left:3px solid var(--line-2);color:var(--ink-2)}
.why.ok{background:var(--ok-soft);border-color:var(--ok)}
.why.bad{background:var(--bad-soft);border-color:var(--bad)}
.why b{color:var(--ink)}
.sticky-bar{position:sticky;bottom:-18px;background:var(--surface);border-top:1px solid var(--line);margin:0 -20px -18px;padding:12px 20px;border-radius:0 0 var(--r) var(--r);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.result{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:9px;background:var(--accent-soft);margin-bottom:12px}
.result b{font-family:"IBM Plex Mono",monospace;font-size:30px;line-height:1;color:var(--accent)}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left;width:100%}
.list-row:hover{border-color:var(--accent)}
.list-row .t{font-weight:600;font-size:14.5px}
.list-row .d{font-size:12.5px;color:var(--ink-3)}
.list-row .right{margin-left:auto;text-align:right;flex:none}

/* ---------- player ---------- */
.player{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:sticky;top:16px}
.wave{display:flex;align-items:flex-end;gap:2px;height:44px;margin:12px 0}
.wave i{flex:1;background:var(--line-2);border-radius:2px;transition:background .2s}
.wave i.on{background:var(--accent)}
.transcript{max-height:280px;overflow-y:auto;margin-top:10px;font-size:14px}
.tline{padding:5px 8px;border-radius:6px;display:flex;gap:9px}
.tline.cur{background:var(--hl-soft)}
.tline .sp{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:78px;padding-top:3px}

/* ---------- writing ---------- */
.split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.chartbox{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:16px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.dtable{width:100%;border-collapse:collapse;font-size:13px;font-family:"IBM Plex Mono",monospace}
.dtable th,.dtable td{padding:5px 9px;border:1px solid var(--line);text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left;font-family:Archivo,sans-serif}
.dtable thead th{background:var(--surface-2);color:var(--ink-2);font-weight:500}
.wcount{display:flex;gap:14px;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3)}
.timer{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;letter-spacing:.02em}
.crit{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--surface)}
.crit h4{font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.crit .bandv{font-family:"IBM Plex Mono",monospace;font-size:19px;color:var(--accent)}
.crit p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.fixlist{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.fixlist li{margin:5px 0}
.diff-old{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.diff-new{color:var(--ok);font-weight:500}

/* ---------- speaking ---------- */
.cue{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:24px 26px;box-shadow:var(--shadow)}
.cue h3{font-size:22px;line-height:1.3}
.cue ul{margin:14px 0 0;padding-left:20px;font-family:Newsreader,serif;font-size:17px;line-height:1.7}
.bigtimer{font-family:"IBM Plex Mono",monospace;font-size:56px;font-weight:600;line-height:1;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}

/* ---------- misc ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 13px;font-size:14px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--ink)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:60;box-shadow:var(--shadow)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:22px;max-width:520px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,20,18,.45)}

/* ---------- từ, phiên âm, tô sáng ---------- */
.w{cursor:pointer;border-radius:3px;padding:0 .04em;transition:background .12s}
.w:hover{background:var(--accent-soft)}
.w.hl-y{background:var(--mk-y)}
.w.hl-g{background:var(--mk-g)}
.w.hl-p{background:var(--mk-p)}
.w.hl-y.hl-edge-l,.w.hl-g.hl-edge-l,.w.hl-p.hl-edge-l{border-radius:4px 0 0 4px;padding-left:.14em}
.w.hl-y.hl-edge-r,.w.hl-g.hl-edge-r,.w.hl-p.hl-edge-r{border-radius:0 4px 4px 0;padding-right:.14em}
.w.tricky{border-bottom:2px dotted var(--warn)}
.w.on{background:var(--accent);color:var(--accent-ink)}
#pop{position:absolute;z-index:70;min-width:210px;max-width:290px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;animation:pop .14s cubic-bezier(.22,1,.36,1)}
#pop .pw{font-family:Newsreader,serif;font-size:19px;font-weight:600;line-height:1.2}
#pop .pi{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent);margin-top:2px}
#pop .pv{font-size:13.5px;color:var(--ink-2);margin-top:6px}
#pop .pr{display:flex;gap:6px;margin-top:11px}
@keyframes pop{from{opacity:0;transform:translateY(5px) scale(.97)}to{opacity:1;transform:none}}
#seltool{position:absolute;z-index:71;display:flex;gap:5px;align-items:center;background:var(--ink);border-radius:99px;padding:5px 7px;box-shadow:var(--shadow);animation:pop .14s cubic-bezier(.22,1,.36,1)}
#seltool button{border:0;background:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;padding:0}
#seltool .sw{width:16px;height:16px;border-radius:50%;display:block;border:1.5px solid rgba(255,255,255,.35)}
#seltool .lbl{color:var(--paper);font-size:12px;padding:0 6px 0 3px;white-space:nowrap}
#seltool button:hover .sw{transform:scale(1.14)}
#seltool .txtbtn{width:auto;padding:0 9px;color:var(--paper);font-size:12px;border-radius:99px}
#seltool .txtbtn:hover{background:rgba(255,255,255,.14)}
.ipa-line{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent);margin-top:4px;line-height:1.5;letter-spacing:-.01em}
.note-row{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:11.5px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:3px 8px;line-height:1.4}
.note b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.tline-tools{display:flex;gap:4px;flex:none;opacity:0;transition:opacity .15s}
.tline:hover .tline-tools,.tline.cur .tline-tools{opacity:1}
.tline-tools button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:24px;height:22px;font-size:11px;line-height:1;padding:0}
.tline-tools button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- sổ tay ---------- */
.bk{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px 14px}
.bk .q{padding:0;border:0}
.mkline{font-family:Newsreader,serif;font-size:16px;line-height:1.6}
.mkline em{font-style:normal;padding:0 .1em;border-radius:3px}
.mk-y{background:var(--mk-y)} .mk-g{background:var(--mk-g)} .mk-p{background:var(--mk-p)}
.srcrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}

/* ---------- hiệu ứng ---------- */
.view-enter{animation:viewIn .28s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dial circle.val{transition:stroke-dasharray .9s cubic-bezier(.22,1,.36,1)}
.pack .bar i{transition:width .7s cubic-bezier(.22,1,.36,1)}
.fcard{transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s}
.fcard.turn{animation:turn .32s cubic-bezier(.22,1,.36,1)}
@keyframes turn{0%{transform:rotateX(0);opacity:1}45%{transform:rotateX(8deg) scale(.985);opacity:.55}100%{transform:none;opacity:1}}
.q.just-right{animation:okpulse .5s ease-out}
.q.just-wrong{animation:badpulse .5s ease-out}
@keyframes okpulse{0%{background:var(--ok-soft)}100%{background:transparent}}
@keyframes badpulse{0%{background:var(--bad-soft)}100%{background:transparent}}
.task,.list-row,.pack{transition:border-color .15s, background .15s, transform .15s}
.task:active,.list-row:active,.pack:active{transform:scale(.995)}
.btn{transition:border-color .15s, background .15s, filter .15s, transform .1s}
.btn:active{transform:scale(.97)}
.toast{animation:pop .18s cubic-bezier(.22,1,.36,1)}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-3);background:var(--surface-2)}
.hint-row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (max-width:1040px){ .hero{grid-template-columns:1fr} .booklet{grid-template-columns:1fr} .split{grid-template-columns:1fr} .passage,.answers{max-height:none} }
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;z-index:50;overflow-x:auto}
  .brand,.rail-foot{display:none}
  .navbtn{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px}
  .navbtn .tag{display:none}
  .main{padding:20px 16px 92px}
  .page-head h1{font-size:26px}
  .dials{grid-template-columns:repeat(2,1fr)}
}
</style>

      <button class="navbtn" id="btnTheme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Đổi giao diện</span></button>

<script>
window.DATA_VOCAB={"packs":[{"id":"education","name":"Education","nameVi":"Giáo dục","words":[{"w":"curriculum","pos":"n","ipa":"/kəˈrɪkjələm/","en":"the set of subjects taught in a school or course","vi":"chương trình học","ex":"The university revised its curriculum to include data literacy.","band":6,"coll":"a broad curriculum"},{"w":"tuition","pos":"n","ipa":"/tjuːˈɪʃn/","en":"fee paid for instruction, especially at university","vi":"học phí","ex":"Many students take part-time jobs to cover their tuition fees.","band":6,"coll":"tuition fees"},{"w":"literacy","pos":"n","ipa":"/ˈlɪtərəsi/","en":"the ability to read and write","vi":"khả năng đọc viết","ex":"Basic literacy is still lacking in some remote rural areas.","band":6,"coll":"improve literacy rates"},{"w":"enrol","pos":"v","ipa":"/ɪnˈrəʊl/","en":"to officially register as a member or student","vi":"đăng ký nhập học","ex":"More than three thousand students enrol at the college each year.","band":6,"coll":"enrol on a course"},{"w":"qualification","pos":"n","ipa":"/ˌkwɒlɪfɪˈkeɪʃn/","en":"a skill or achievement that makes someone suitable for a job or task","vi":"bằng cấp, chứng chỉ","ex":"Employers increasingly expect candidates to hold a relevant qualification.","band":6,"coll":"gain a qualification"},{"w":"undergraduate","pos":"n","ipa":"/ˌʌndəˈɡrædʒuət/","en":"a student studying for a first university degree","vi":"sinh viên đại học chưa tốt nghiệp","ex":"Undergraduate courses in this field usually last three years.","band":6.5,"coll":"undergraduate degree"},{"w":"vocational","pos":"adj","ipa":"/vəʊˈkeɪʃənl/","en":"relating to the skills needed for a particular job","vi":"thuộc về dạy nghề","ex":"Vocational training equips school leavers with practical workplace skills.","band":6.5,"coll":"vocational training"},{"w":"scholarship","pos":"n","ipa":"/ˈskɒləʃɪp/","en":"a grant awarded to support a student's education","vi":"học bổng","ex":"She was awarded a scholarship to study engineering abroad.","band":6.5,"coll":"win a scholarship"},{"w":"faculty","pos":"n","ipa":"/ˈfæklti/","en":"a department or group of related departments in a university","vi":"khoa trong trường đại học","ex":"The faculty of engineering introduced a new artificial intelligence module.","band":6.5,"coll":"join the faculty"},{"w":"plagiarism","pos":"n","ipa":"/ˈpleɪdʒərɪzəm/","en":"using someone else's work or ideas without acknowledgement","vi":"đạo văn","ex":"Universities use software to detect plagiarism in student assignments.","band":6.5,"coll":"commit plagiarism"},{"w":"pedagogy","pos":"n","ipa":"/ˈpedəɡɒdʒi/","en":"the method and practice of teaching","vi":"phương pháp sư phạm","ex":"Modern pedagogy encourages active discussion rather than passive listening.","band":6.5,"coll":"innovative pedagogy"},{"w":"rote learning","pos":"n","ipa":"/rəʊt ˈlɜːnɪŋ/","en":"memorising information through repetition rather than through understanding","vi":"học vẹt","ex":"Critics argue that rote learning discourages independent critical thinking.","band":7,"coll":"rely on rote learning"},{"w":"autonomy","pos":"n","ipa":"/ɔːˈtɒnəmi/","en":"the ability to make one's own decisions independently","vi":"tính tự chủ","ex":"Distance learning gives students greater autonomy over their own schedules.","band":7,"coll":"student autonomy"},{"w":"attainment","pos":"n","ipa":"/əˈteɪnmənt/","en":"the level of skill or knowledge someone has reached","vi":"thành tích học tập","ex":"Family income is closely linked to educational attainment in many countries.","band":7,"coll":"raise attainment levels"},{"w":"streaming","pos":"n","ipa":"/ˈstriːmɪŋ/","en":"grouping students by ability for teaching purposes","vi":"phân luồng xếp lớp theo năng lực","ex":"Some schools abandoned streaming in favour of mixed-ability classes.","band":7,"coll":"ability streaming"},{"w":"formative assessment","pos":"n","ipa":"/ˈfɔːmətɪv əˈsesmənt/","en":"ongoing evaluation used to guide learning during a course","vi":"đánh giá quá trình học","ex":"Teachers use formative assessment to identify gaps before the final exam.","band":7,"coll":"conduct formative assessment"},{"w":"pedagogical","pos":"adj","ipa":"/ˌpedəˈɡɒdʒɪkl/","en":"relating to teaching methods","vi":"thuộc về sư phạm","ex":"The reform reflects a shift in pedagogical approach towards student-centred learning.","band":7.5,"coll":"pedagogical approach"},{"w":"meritocratic","pos":"adj","ipa":"/ˌmerɪtəˈkrætɪk/","en":"based on ability and talent rather than wealth or social class","vi":"trọng dụng nhân tài","ex":"Advocates claim standardised testing makes university admissions more meritocratic.","band":7.5,"coll":"a meritocratic system"},{"w":"disengagement","pos":"n","ipa":"/ˌdɪsɪnˈɡeɪdʒmənt/","en":"loss of interest or involvement in something, especially learning","vi":"sự mất hứng thú, xa rời việc học","ex":"Prolonged online classes led to widespread disengagement among younger pupils.","band":7.5,"coll":"student disengagement"},{"w":"credentialism","pos":"n","ipa":"/krɪˈdenʃəlɪzəm/","en":"excessive emphasis on formal qualifications as a hiring requirement","vi":"xu hướng đề cao bằng cấp quá mức","ex":"Some economists blame credentialism for pushing graduates into unnecessary debt.","band":7.5,"coll":"rising credentialism"}]},{"id":"environment","name":"Environment","nameVi":"Môi trường","words":[{"w":"pollution","pos":"n","ipa":"/pəˈluːʃn/","en":"the presence of harmful substances in the environment","vi":"ô nhiễm","ex":"Air pollution levels in the capital have risen sharply this decade.","band":6,"coll":"reduce pollution"},{"w":"renewable","pos":"adj","ipa":"/rɪˈnjuːəbl/","en":"able to be replenished naturally and not depleted when used","vi":"có thể tái tạo","ex":"The government aims to generate half its electricity from renewable sources.","band":6,"coll":"renewable energy"},{"w":"emission","pos":"n","ipa":"/ɪˈmɪʃn/","en":"a substance discharged into the air, especially a gas","vi":"khí thải","ex":"Vehicle emissions are a major contributor to urban smog.","band":6,"coll":"cut emissions"},{"w":"drought","pos":"n","ipa":"/draʊt/","en":"a prolonged period of abnormally low rainfall","vi":"hạn hán","ex":"The region suffered a severe drought that devastated local crops.","band":6,"coll":"prolonged drought"},{"w":"habitat","pos":"n","ipa":"/ˈhæbɪtæt/","en":"the natural home of a plant or animal","vi":"môi trường sống","ex":"Deforestation continues to destroy the natural habitat of many species.","band":6,"coll":"natural habitat"},{"w":"sustainable","pos":"adj","ipa":"/səˈsteɪnəbl/","en":"able to continue over time without depleting resources","vi":"bền vững","ex":"Farmers are adopting more sustainable methods to protect soil quality.","band":6.5,"coll":"sustainable development"},{"w":"deforestation","pos":"n","ipa":"/diːˌfɒrɪˈsteɪʃn/","en":"the clearing of forests, usually to use the land for other purposes","vi":"phá rừng","ex":"Deforestation in the Amazon has accelerated due to illegal logging.","band":6.5,"coll":"large-scale deforestation"},{"w":"biodiversity","pos":"n","ipa":"/ˌbaɪəʊdaɪˈvɜːsəti/","en":"the variety of plant and animal life in a particular area","vi":"đa dạng sinh học","ex":"Coral reefs support an extraordinary level of marine biodiversity.","band":6.5,"coll":"loss of biodiversity"},{"w":"greenhouse gas","pos":"n","ipa":"/ˈɡriːnhaʊs ɡæs/","en":"a gas that traps heat in the atmosphere","vi":"khí nhà kính","ex":"Carbon dioxide is the most abundant greenhouse gas produced by industry.","band":6.5,"coll":"greenhouse gas emissions"},{"w":"contamination","pos":"n","ipa":"/kənˌtæmɪˈneɪʃn/","en":"the process of making something impure by adding harmful substances","vi":"sự ô nhiễm nhiễm độc","ex":"Contamination of the river forced local authorities to close the water supply.","band":6.5,"coll":"soil contamination"},{"w":"conservation","pos":"n","ipa":"/ˌkɒnsəˈveɪʃn/","en":"protection of the natural environment and wildlife","vi":"bảo tồn","ex":"The charity funds conservation projects aimed at protecting endangered turtles.","band":6.5,"coll":"wildlife conservation"},{"w":"carbon footprint","pos":"n","ipa":"/ˈkɑːbən ˈfʊtprɪnt/","en":"the total amount of greenhouse gases produced by a person or activity","vi":"dấu chân carbon","ex":"Flying frequently significantly increases an individual's carbon footprint.","band":7,"coll":"reduce your carbon footprint"},{"w":"mitigate","pos":"v","ipa":"/ˈmɪtɪɡeɪt/","en":"to make something less severe or harmful","vi":"giảm nhẹ","ex":"Planting mangroves can help mitigate the impact of coastal flooding.","band":7,"coll":"mitigate the effects of"},{"w":"depletion","pos":"n","ipa":"/dɪˈpliːʃn/","en":"the reduction of something to a dangerously low level","vi":"sự cạn kiệt","ex":"Overfishing has caused a severe depletion of fish stocks worldwide.","band":7,"coll":"resource depletion"},{"w":"ecosystem","pos":"n","ipa":"/ˈiːkəʊsɪstəm/","en":"a community of living organisms interacting with their environment","vi":"hệ sinh thái","ex":"Wetlands form a fragile ecosystem that filters pollutants from water.","band":7,"coll":"fragile ecosystem"},{"w":"degradation","pos":"n","ipa":"/ˌdeɡrəˈdeɪʃn/","en":"the process of deterioration, especially in the quality of land","vi":"sự suy thoái","ex":"Land degradation from intensive farming threatens future food security.","band":7,"coll":"environmental degradation"},{"w":"unsustainable","pos":"adj","ipa":"/ˌʌnsəˈsteɪnəbl/","en":"not able to continue at the current rate without causing harm","vi":"không bền vững","ex":"Current levels of groundwater extraction are widely regarded as unsustainable.","band":7.5,"coll":"unsustainable consumption"},{"w":"eutrophication","pos":"n","ipa":"/juːˌtrɒfɪˈkeɪʃn/","en":"excessive nutrient enrichment that causes dense plant growth and oxygen loss in water","vi":"phú dưỡng hóa","ex":"Fertiliser run-off is a leading cause of eutrophication in nearby lakes.","band":7.5,"coll":"cause eutrophication"},{"w":"irreversible","pos":"adj","ipa":"/ˌɪrɪˈvɜːsəbl/","en":"not able to be changed back to a previous state","vi":"không thể đảo ngược","ex":"Scientists warn that some glacial melting may already be irreversible.","band":7.5,"coll":"irreversible damage"},{"w":"anthropogenic","pos":"adj","ipa":"/ˌænθrəpəˈdʒenɪk/","en":"originating from human activity","vi":"do con người gây ra","ex":"Anthropogenic warming is now the dominant driver of climate change.","band":7.5,"coll":"anthropogenic climate change"}]},{"id":"technology","name":"Technology","nameVi":"Công nghệ","words":[{"w":"device","pos":"n","ipa":"/dɪˈvaɪs/","en":"a piece of equipment made for a specific purpose","vi":"thiết bị","ex":"Most teenagers now own a mobile device with internet access.","band":6,"coll":"electronic device"},{"w":"software","pos":"n","ipa":"/ˈsɒftweə(r)/","en":"the programs used to operate a computer","vi":"phần mềm","ex":"The company released new software to protect users from viruses.","band":6,"coll":"install software"},{"w":"innovation","pos":"n","ipa":"/ˌɪnəˈveɪʃn/","en":"the introduction of new ideas, methods or products","vi":"sự đổi mới, cải tiến","ex":"Technological innovation has transformed the way people communicate.","band":6,"coll":"technological innovation"},{"w":"upgrade","pos":"v","ipa":"/ʌpˈɡreɪd/","en":"to improve a system by installing newer or better equipment","vi":"nâng cấp","ex":"The firm upgraded its servers to handle increased online traffic.","band":6,"coll":"upgrade a system"},{"w":"malfunction","pos":"n","ipa":"/ˌmælˈfʌŋkʃn/","en":"a failure to function normally","vi":"trục trặc, hỏng hóc","ex":"A software malfunction delayed hundreds of flights across the country.","band":6,"coll":"system malfunction"},{"w":"automation","pos":"n","ipa":"/ˌɔːtəˈmeɪʃn/","en":"the use of machines to perform tasks without human control","vi":"tự động hóa","ex":"Automation has replaced many repetitive jobs in manufacturing.","band":6.5,"coll":"workplace automation"},{"w":"algorithm","pos":"n","ipa":"/ˈælɡərɪðəm/","en":"a set of rules followed to solve a problem or perform a task","vi":"thuật toán","ex":"Social media platforms use algorithms to decide which posts users see.","band":6.5,"coll":"a complex algorithm"},{"w":"connectivity","pos":"n","ipa":"/ˌkɒnekˈtɪvəti/","en":"the state of being connected, especially to the internet","vi":"khả năng kết nối","ex":"Poor connectivity in rural areas limits access to online education.","band":6.5,"coll":"internet connectivity"},{"w":"obsolete","pos":"adj","ipa":"/ˈɒbsəliːt/","en":"no longer used because something newer and better exists","vi":"lỗi thời","ex":"Many traditional skills have become obsolete due to automation.","band":6.5,"coll":"become obsolete"},{"w":"encryption","pos":"n","ipa":"/ɪnˈkrɪpʃn/","en":"the process of converting information into a secure code","vi":"mã hóa","ex":"Banks rely on encryption to keep customers' financial data safe.","band":6.5,"coll":"data encryption"},{"w":"artificial intelligence","pos":"n","ipa":"/ˌɑːtɪfɪʃl ɪnˈtelɪdʒəns/","en":"computer systems able to perform tasks that normally require human intelligence","vi":"trí tuệ nhân tạo","ex":"Artificial intelligence is increasingly used to diagnose diseases accurately.","band":6.5,"coll":"the rise of artificial intelligence"},{"w":"digitise","pos":"v","ipa":"/ˈdɪdʒɪtaɪz/","en":"to convert information into digital form","vi":"số hóa","ex":"The library digitised thousands of manuscripts to preserve them for future generations.","band":7,"coll":"digitise records"},{"w":"surveillance","pos":"n","ipa":"/səˈveɪləns/","en":"close monitoring of a person, group or place","vi":"giám sát","ex":"Widespread surveillance has raised serious concerns about personal privacy.","band":7,"coll":"mass surveillance"},{"w":"cybersecurity","pos":"n","ipa":"/ˌsaɪbəsɪˈkjʊərəti/","en":"measures taken to protect computer systems from attack or damage","vi":"an ninh mạng","ex":"Companies are investing heavily in cybersecurity to prevent data breaches.","band":7,"coll":"strengthen cybersecurity"},{"w":"proliferation","pos" ess through examination","vi":"chẩn đoán","ex":"An early diagnosis greatly improves the chances of successful treatment.","band":6,"coll":"early diagnosis"},{"w":"nutrition","pos":"n","ipa":"/njuːˈtrɪʃn/","en":"the process of providing the food necessary for health and growth","vi":"dinh dưỡng","ex":"Poor nutrition in childhood can affect long-term physical development.","band":6,"coll":"balanced nutrition"},{"w":"sedentary","pos":"adj","ipa":"/ˈsedntri/","en":"characterised by sitting and taking little physical exercise","vi":"ít vận động","ex":"A sedentary lifestyle is linked to a higher risk of heart disease.","band":6,"coll":"sedentary lifestyle"},{"w":"immunisation","pos":"n","ipa":"/ˌɪmjunaɪˈzeɪʃn/","en":"the process of making a person immune to infection, usually by vaccine","vi":"tiêm chủng","ex":"Widespread immunisation has almost eliminated measles in many countries.","band":6,"coll":"immunisation programme"},{"w":"epidemic","pos":"n","ipa":"/ˌepɪˈdemɪk/","en":"a widespread occurrence of a disease within a community at a particular time","vi":"dịch bệnh","ex":"Health officials declared an epidemic after cases tripled within weeks.","band":6.5,"coll":"contain an epidemic"},{"w":"sanitation","pos":"n","ipa":"/ˌsænɪˈteɪʃn/","en":"systems for maintaining public health, especially clean water and waste disposal","vi":"vệ sinh môi trường","ex":"Poor sanitation remains a leading cause of disease in developing regions.","band":6.5,"coll":"improve sanitation"},{"w":"chronic","pos":"adj","ipa":"/ˈkrɒnɪk/","en":"persisting for a long time or constantly recurring","vi":"mạn tính","ex":"Chronic illnesses such as diabetes place a heavy burden on health systems.","band":6.5,"coll":"chronic disease"},{"w":"life expectancy","pos":"n","ipa":"/laɪf ɪkˈspektənsi/","en":"the average number of years a person is expected to live","vi":"tuổi thọ trung bình","ex":"Life expectancy has risen steadily thanks to advances in medicine.","band":6.5,"coll":"increase life expectancy"},{"w" any older patients.","band":7.5,"coll":"increase comorbidity risk"},{"w":"epidemiological","pos":"adj","ipa":"/ˌepɪˌdiːmiəˈlɒdʒɪkl/","en":"relating to the study of the patterns and causes of disease in populations","vi":"thuộc dịch tễ học","ex":"Epidemiological data revealed a sharp rise in infection rates last winter.","band":7.5,"coll":"epidemiological evidence"},{"w":"asymptomatic","pos":"adj","ipa":"/ˌeɪsɪmptəˈmætɪk/","en":"showing no symptoms of a disease despite being infected","vi":"không có triệu chứng","ex":"Many carriers of the virus remained entirely asymptomatic throughout.","band":7.5,"coll":"asymptomatic carrier"},{"w":"palliative","pos":"adj","ipa":"/ˈpælieɪtɪv/","en":"relieving pain or symptoms without treating the underlying cause","vi":"giảm nhẹ, không chữa khỏi","ex":"Palliative care focuses on comfort rather than curing a terminal illness.","band":7.5,"coll":"palliative care"}]},{"id":"work-economy","name":"Work & Economy","nameVi":"Công việc & Kinh tế","words":[{"w":"employment","pos":"n","ipa":"/ɪmˈplɔɪmənt/","en":"the state of having paid work","vi":"việc làm","ex":"The new factory created hundreds of jobs and boosted local employment.","band":6,"coll":"full employment"},{"w":"income","pos":"n","ipa":"/ˈɪnkʌm/","en":"money received regularly for work or through investment","vi":"thu nhập","ex":"Household income has barely kept pace with rising living costs.","band":6,"coll":"average income"},{"w":"recession","pos":"n","ipa":"/rɪˈseʃn/","en":"a period of temporary economic decline","vi":"suy thoái kinh tế","ex":"The country slipped into recession after two quarters of negative growth.","band":6,"coll":"economic recession"},{"w":"workforce","pos":"n","ipa":"/ˈwɜːkfɔːs/","en":"the people who work in a country, company or industry","vi":"lực lượng lao động","ex":"Automation is expected to reshape a large part of the workforce.","band":6,"coll":"skilled workforce"},{"w":"inflation","pos":"n","ipa":"/ɪnˈfleɪʃn/","en":"a general increase in prices and a fall in the value of money","vi":"lạm phát","ex":"Rising inflation has made everyday essentials significantly more expensive.","band":6,"coll":"curb inflation"},{"w":"redundancy","pos":"n","ipa":"/rɪˈdʌndənsi/","en":"the loss of a job because it is no longer needed","vi":"sự sa thải do dư thừa nhân lực","ex":"Hundreds of staff faced redundancy after the two companies merged.","band":6.5,"coll":"compulsory redundancy"},{"w":"entrepreneur","pos":"n","ipa":"/ˌɒntrəprəˈnɜː(r)/","en":"a person who starts and runs a business, taking on financial risk","vi":"doanh nhân khởi nghiệp","ex":"Young entrepreneurs are increasingly turning to online platforms to launch start-ups.","band":6.5,"coll":"aspiring entrepreneur"},{"w":"subsidy","pos":"n","ipa":"/ˈsʌbsədi/","en":"money given by the government to support an industry or activity","vi":"trợ cấp","ex":"Farmers rely heavily on government subsidies to remain competitive.","band":6.5,"coll":"government subsidy"},{"w":"outsourcing","pos":"n","ipa":"/ˈaʊtsɔːsɪŋ/","en":"the practice of contracting work out to an external company, often abroad","vi":"thuê ngoài, gia công","ex":"Outsourcing production overseas has cut costs but reduced local jobs.","band":6.5,"coll":"outsource production"},{"w":"productivity","pos":"n","ipa":"/ˌprɒdʌkˈtɪvəti/","en":"the rate at which goods or services are produced","vi":"năng suất","ex":"Investment in staff training has significantly improved overall productivity.","band":6.5,"coll":"boost productivity"},{"w":"gig economy","pos":"n","ipa":"/ɡɪɡ ɪˈkɒnəmi/","en":"a labour market characterised by short-term and freelance jobs rather than permanent employment","vi":"kinh tế việc làm tự do","ex":"The gig economy offers flexibility but often lacks job security.","band":6.5,"coll":"the rise of the gig economy"},{"w":"deregulation","pos":"n","ipa":"/ˌdiːˌreɡjʊˈleɪʃn/","en":"the reduction or removal of government control over an industry","vi":"bãi bỏ quy định","ex":"Deregulation of the banking sector was "w":"attrition","pos":"n","ipa":"/əˈtrɪʃn/","en":"the gradual reduction of staff numbers through retirement or resignation rather than layoffs","vi":"sự giảm biên chế tự nhiên","ex":"The company reduced its headcount through natural attrition rather than layoffs.","band":7.5,"coll":"staff attrition"}]},{"id":"urban-transport","name":"Urban Transport","nameVi":"Đô thị & Giao thông","words":[{"w":"commute","pos":"v","ipa":"/kəˈmjuːt/","en":"to travel regularly between home and work","vi":"đi lại giữa nhà và nơi làm việc","ex":"Many residents commute over an hour each way to reach the city centre.","band":6,"coll":"daily commute"},{"w":"congestion","pos":"n","ipa":"/kənˈdʒestʃən/","en":"overcrowding that causes traffic to move slowly","vi":"tắc nghẽn giao thông","ex":"Traffic congestion during rush hour adds significantly to journey times.","band":6,"coll":"traffic congestion"},{"w":"pedestrian","pos":"n","ipa":"/pəˈdestriən/","en":"a person walking rather than travelling in a vehicle","vi":"người đi bộ","ex":"The new crossing was built to improve safety for pedestrians.","band":6,"coll":"pedestrian crossing"},{"w":"infrastructure","pos":"n","ipa":"/ˈɪnfrəstrʌktʃə(r)/","en":"the basic physical systems of a country, such as roads and bridges","vi":"cơ sở hạ tầng","ex":"The government pledged more funding to upgrade transport infrastructure.","band":6,"coll":"transport infrastructure"},{"w":"suburb","pos":"n","ipa":"/ˈsʌbɜːb/","en":"a residential area on the outskirts of a city","vi":"vùng ngoại ô","ex":"Property prices in the suburbs are considerably lower than downtown.","band":6,"coll":"residential suburb"},{"w":"urbanisation","pos":"n","ipa":"/ˌɜːbənaɪˈzeɪʃn/","en":"the process by which cities grow as people move from rural areas","vi":"đô thị hóa","ex":"Rapid urbanisation has placed enormous pressure on housing supply.","band":6.5,"coll":"rapid urbanisation"},{"w":"gridlock","pos":"n","ipa":"/ˈɡrɪdlɒk/","en":"a situation in which traffic is completely unable to move
