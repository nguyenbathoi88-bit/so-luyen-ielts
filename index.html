":"/ˈbɒtlnek/","en":"a point of congestion that restricts the flow of traffic","vi":"điểm nghẽn giao thông","ex":"The narrow bridge has long been a bottleneck for morning traffic.","band":7,"coll":"traffic bottleneck"},{"w":"accessibility","pos":"n","ipa":"/əkˌsesəˈbɪləti/","en":"the quality of being easy to reach or use","vi":"khả năng tiếp cận","ex":"Improving accessibility to public transport benefits elderly and disabled residents.","band":7,"coll":"improve accessibility"},{"w":"multimodal","pos":"adj","ipa":"/ˌmʌltiˈməʊdl/","en":"involving several different modes of transport combined together","vi":"đa phương thức","ex":"The city is developing a multimodal network combining buses, trams and cycle paths.","band":7.5,"coll":"multimodal transport network"},{"w":"peripheral","pos":"adj","ipa":"/pəˈrɪfərəl/","en":"relating to the outer edge or outlying district of an area","vi":"vùng ven, ngoại vi","ex":"Peripheral districts often receive far less transport investment than the centre.","band":7.5,"coll":"peripheral areas"},{"w":"congested","pos":"adj","ipa":"/kənˈdʒestɪd/","en":"crowded and blocked, especially with traffic","vi":"đông đúc, tắc nghẽn","ex":"The city's most congested roads see average speeds below ten miles an hour.","band":7.5,"coll":"heavily congested"},{"w":"densification","pos":"n","ipa":"/ˌdensɪfɪˈkeɪʃn/","en":"the process of increasing the number of buildings or people within a given urban area","vi":"sự gia tăng mật độ đô thị","ex":"Planners favour densification over sprawl in order to preserve green space.","band":7.5,"coll":"urban densification"}]},{"id":"media-culture","name":"Media & Culture","nameVi":"Truyền thông & Văn hóa","words":[{"w":"broadcast","pos":"v","ipa":"/ˈbrɔːdkɑːst/","en":"to transmit a programme on television or radio","vi":"phát sóng","ex":"The interview was broadcast live to millions of viewers nationwide.","band":6,"coll":"broadcast live"},{"w":"censorship","pos":"n","ipa":"/ˈsensəʃɪp/","en":"the suppression of information or material considered unacceptable","vi":"kiểm duyệt","ex":"Strict censorship prevents journalists from reporting freely in some countries.","band":6,"coll":"media censorship"},{"w":"heritage","pos":"n","ipa":"/ˈherɪtɪdʒ/","en":"traditions, buildings and culture that are passed down through generations","vi":"di sản","ex":"The old town was declared a protected heritage site.","band":6,"coll":"cultural heritage"},{"w":"audience","pos":"n","ipa":"/ˈɔːdiəns/","en":"the group of people watching, reading or listening to something","vi":"khán giả, độc giả","ex":"Streaming services have reached a far wider audience than traditional television.","band":6,"coll":"target audience"},{"w":"tabloid","pos":"n","ipa":"/ˈtæblɔɪd/","en":"a newspaper with small pages, often featuring sensational stories","vi":"báo lá cải","ex":"Tabloid newspapers often prioritise celebrity gossip over serious news.","band":6,"coll":"tabloid press"},{"w":"globalisation","pos":"n","ipa":"/ˌɡləʊbəlaɪˈzeɪʃn/","en":"the process by which businesses and cultures increasingly interact worldwide","vi":"toàn cầu hóa","ex":"Globalisation has made foreign films and music far more accessible.","band":6.5,"coll":"cultural globalisation"},{"w":"propaganda","pos":"n","ipa":"/ˌprɒpəˈɡændə/","en":"biased or misleading information used to promote a political cause","vi":"tuyên truyền","ex":"The regime used state television to spread propaganda during the election.","band":6.5,"coll":"spread propaganda"},{"w":"misinformation","pos":"n","ipa":"/ˌmɪsɪnfəˈmeɪʃn/","en":"false or inaccurate information that is spread regardless of intent to deceive","vi":"thông tin sai lệch","ex":"Misinformation about the vaccine spread rapidly across social media.","band":6.5,"coll":"combat misinformation"},{"w":"assimilation","pos":"n","ipa":"/əˌsɪmɪˈleɪʃn/","en":"the process of adopting the customs and language of a different culture or group","vi":"sự đồng hóa văn hóa","ex":"Language barriers can slow the assimilation of new immigrants.","band":6.5,"coll":"cultural assimilation"},{"w":"homogenise","pos":"v","ipa":"/həˈmɒdʒənaɪz/","en":"to make different things become similar or uniform","vi":"đồng hóa, làm đồng nhất","ex":"Critics argue that global brands homogenise local culture and taste.","band":6.5,"coll":"homogenise culture"},{"w":"subscription","pos":"n","ipa":"/səbˈskrɪpʃn/","en":"a payment made regularly to receive a service or publication","vi":"đăng ký thuê bao dịch vụ","ex":"Streaming subscription services have overtaken cinema attendance in popularity.","band":6.5,"coll":"streaming subscription"},{"w":"sensationalise","pos":"v","ipa":"/senˈseɪʃənəlaɪz/","en":"to present information in an exaggerated way in order to provoke interest","vi":"giật gân hóa thông tin","ex":"Some outlets sensationalise minor incidents in order to attract more clicks.","band":7,"coll":"sensationalise a story"},{"w":"discourse","pos":"n","ipa":"/ˈdɪskɔːs/","en":"written or spoken communication or debate about a particular topic","vi":"diễn ngôn, tranh luận","ex":"Social media has reshaped public discourse around political issues.","band":7,"coll":"public discourse"},{"w":"authenticity","pos":"n","ipa":"/ˌɔːθenˈtɪsəti/","en":"the quality of being genuine, real or original","vi":"tính xác thực","ex":"Audiences increasingly value authenticity over polished, scripted content.","band":7,"coll":"question the authenticity"},{"w":"commercialisation","pos":"n","ipa":"/kəˌmɜːʃəlaɪˈzeɪʃn/","en":"the process of managing something mainly to make a profit","vi":"thương mại hóa","ex":"The commercialisation of traditional festivals has diluted their original meaning.","band":7,"coll":"commercialisation of culture"},{"w":"polarise","pos":"v","ipa":"/ˈpəʊləraɪz/","en":"to divide people into two sharply contrasting groups or opinions","vi":"phân cực dư luận","ex":"Divisive headlines have helped polarise public opinion on immigration.","band":7,"coll":"polarise public opinion"},{"w":"hegemony","pos":"n","ipa":"/hɪˈdʒeməni/","en":"dominance of one group, culture or nation over others","vi":"sự bá quyền, chi phối","ex":"Some scholars argue Western media still exert cultural hegemony worldwide.","band":7.5,"coll":"cultural hegemony"},{"w":"echo chamber","pos":"n","ipa":"/ˈekəʊ ˌtʃeɪmbə(r)/","en":"an environment in which people only encounter opinions that reinforce their own","vi":"buồng vọng âm, bong bóng thông tin","ex":"Personalised algorithms risk trapping users inside an echo chamber.","band":7.5,"coll":"create an echo chamber"},{"w":"dissemination","pos":"n","ipa":"/dɪˌsemɪˈneɪʃn/","en":"the spreading of information widely to a large audience","vi":"sự truyền bá, phổ biến","ex":"Rapid dissemination of unverified claims online undermines public trust.","band":7.5,"coll":"rapid dissemination"},{"w":"pluralism","pos":"n","ipa":"/ˈplʊərəlɪzəm/","en":"the existence of many different views or groups within one society","vi":"tính đa nguyên","ex":"Media pluralism is essential to prevent any single narrative from dominating.","band":7.5,"coll":"media pluralism"}]},{"id":"government-society","name":"Government & Society","nameVi":"Chính phủ & Xã hội","words":[{"w":"legislation","pos":"n","ipa":"/ˌledʒɪsˈleɪʃn/","en":"laws considered collectively","vi":"luật pháp, đạo luật","ex":"New legislation was introduced to reduce plastic waste in supermarkets.","band":6,"coll":"pass legislation"},{"w":"citizen","pos":"n","ipa":"/ˈsɪtɪzn/","en":"a legally recognised member of a particular state or country","vi":"công dân","ex":"Every citizen over eighteen is entitled to vote in the election.","band":6,"coll":"law-abiding citizen"},{"w":"welfare","pos":"n","ipa":"/ˈwelfeə(r)/","en":"financial or other support provided to people in need","vi":"phúc lợi xã hội","ex":"The welfare system provides financial support to unemployed families.","band":6,"coll":"welfare system"},{"w":"inequality","pos":"n","ipa":"/ˌɪnɪˈkwɒləti/","en":"unfair differences in wealth, status or opportunity between groups","vi":"bất bình đẳng","ex":"Income inequality has widened significantly over the past decade.","band":6,"coll":"income inequality"},{"w":"taxation","pos":"n","ipa":"/tækˈseɪʃn/","en":"the system by which a government raises money by charging taxes","vi":"hệ thống thuế","ex":"Higher taxation on tobacco is intended to discourage smoking.","band":6,"coll":"progressive taxation"},{"w":"bureaucracy","pos":"n","ipa":"/bjʊəˈrɒkrəsi/","en":"a system of government with many departments and officials, often seen as slow","vi":"bộ máy quan liêu","ex":"Excessive bureaucracy can delay even simple planning applications for months.","band":6.5,"coll":"cut through bureaucracy"},{"w":"accountability","pos":"n","ipa":"/əˌkaʊntəˈbɪləti/","en":"the obligation to accept responsibility for one's actions and decisions","vi":"trách nhiệm giải trình","ex":"Voters expect greater accountability from their elected officials.","band":6.5,"coll":"public accountability"},{"w":"corruption","pos":"n","ipa":"/kəˈrʌpʃn/","en":"dishonest or fraudulent conduct by those in positions of power","vi":"tham nhũng","ex":"Widespread corruption has undermined public trust in the government.","band":6.5,"coll":"tackle corruption"},{"w":"legislature","pos":"n","ipa":"/ˈledʒɪsleɪtʃə(r)/","en":"the branch of government responsible for making laws","vi":"cơ quan lập pháp","ex":"The bill must be approved by the legislature before it takes effect.","band":6.5,"coll":"national legislature"},{"w":"marginalised","pos":"adj","ipa":"/ˈmɑːdʒɪnəlaɪzd/","en":"treated as insignificant or peripheral by the rest of society","vi":"bị gạt ra ngoài lề","ex":"Marginalised communities often have limited access to healthcare services.","band":6.5,"coll":"marginalised groups"},{"w":"referendum","pos":"n","ipa":"/ˌrefəˈrendəm/","en":"a vote on a single political question put to the whole electorate","vi":"trưng cầu dân ý","ex":"The country held a referendum on whether to join the union.","band":6.5,"coll":"hold a referendum"},{"w":"devolution","pos":"n","ipa":"/ˌdiːvəˈluːʃn/","en":"the transfer of power from central government to regional government","vi":"phân quyền","ex":"Devolution gave regional assemblies greater control over local budgets.","band":7,"coll":"political devolution"},{"w":"entitlement","pos":"n","ipa":"/ɪnˈtaɪtlmənt/","en":"a right to receive a particular benefit or service","vi":"quyền được hưởng trợ cấp","ex":"Cuts to welfare entitlement sparked protests across several cities.","band":7,"coll":"welfare entitlement"},{"w":"disenfranchised","pos":"adj","ipa":"/ˌdɪsɪnˈfræntʃaɪzd/","en":"deprived of the right to vote or of other legal rights","vi":"bị tước quyền bầu cử","ex":"Disenfranchised voters felt increasingly detached from mainstream politics.","band":7,"coll":"disenfranchised communities"},{"w":"redistribution","pos":"n","ipa":"/ˌriːdɪstrɪˈbjuːʃn/","en":"the sharing out of wealth or resources more evenly across society","vi":"sự tái phân phối","ex":"Progressive taxation is one tool used for wealth redistribution.","band":7,"coll":"wealth redistribution"},{"w":"civic","pos":"adj","ipa":"/ˈsɪvɪk/","en":"relating to a city, or to citizenship and public affairs","vi":"thuộc về công dân, cộng đồng","ex":"Volunteering fosters a stronger sense of civic responsibility among young people.","band":7,"coll":"civic duty"},{"w":"socioeconomic","pos":"adj","ipa":"/ˌsəʊsiəʊˌiːkəˈnɒmɪk/","en":"relating to the interaction of social and economic factors","vi":"kinh tế xã hội","ex":"Children from lower socioeconomic backgrounds often face unequal access to resources.","band":7.5,"coll":"socioeconomic background"},{"w":"paternalistic","pos":"adj","ipa":"/pəˌtɜːnəlˈɪstɪk/","en":"restricting people's freedom or choices for their own perceived good","vi":"mang tính gia trưởng, áp đặt","ex":"Critics called the new curfew law overly paternalistic.","band":7.5,"coll":"paternalistic policy"},{"w":"stratification","pos":"n","ipa":"/ˌstrætɪfɪˈkeɪʃn/","en":"the division of society into hierarchical layers or classes","vi":"sự phân tầng xã hội","ex":"Social stratification remains deeply entrenched in many societies today.","band":7.5,"coll":"social stratification"},{"w":"egalitarian","pos":"adj","ipa":"/ɪˌɡælɪˈteəriən/","en":"based on the belief that all people deserve equal rights and opportunities","vi":"theo chủ nghĩa bình đẳng","ex":"The Nordic countries are often praised for their egalitarian policies.","band":7.5,"coll":"an egalitarian society"}]},{"id":"trends-task1","name":"Task 1 Trends","nameVi":"Xu hướng Task 1","words":[{"w":"increase","pos":"v","ipa":"/ɪnˈkriːs/","en":"to become or make larger in amount or number","vi":"tăng lên","ex":"The number of visitors increased steadily between 2015 and 2020.","band":6,"coll":"increase steadily"},{"w":"decrease","pos":"v","ipa":"/dɪˈkriːs/","en":"to become or make smaller in amount or number","vi":"giảm xuống","ex":"Unemployment decreased slightly during the final quarter of the year.","band":6,"coll":"decrease slightly"},{"w":"fluctuate","pos":"v","ipa":"/ˈflʌktʃueɪt/","en":"to rise and fall irregularly over a period of time","vi":"dao động","ex":"Oil prices fluctuated considerably throughout the following six months.","band":6,"coll":"fluctuate wildly"},{"w":"remain stable","pos":"v","ipa":"/rɪˈmeɪn ˈsteɪbl/","en":"to stay at roughly the same level over a period of time","vi":"duy trì ổn định","ex":"Sales figures remained stable for most of the period shown.","band":6,"coll":"remain relatively stable"},{"w":"proportion","pos":"n","ipa":"/prəˈpɔːʃn/","en":"a part or share of a whole, often expressed as a percentage","vi":"tỷ lệ","ex":"Only a small proportion of households owned a computer in 1990.","band":6,"coll":"a growing proportion"},{"w":"surge","pos":"v","ipa":"/sɜːdʒ/","en":"to increase suddenly and by a large amount","vi":"tăng vọt","ex":"Demand for electric vehicles surged after the government announced price cuts.","band":6.5,"coll":"surge dramatically"},{"w":"plummet","pos":"v","ipa":"/ˈplʌmɪt/","en":"to fall suddenly and steeply","vi":"giảm mạnh, lao dốc","ex":"House prices plummeted following the onset of the financial crisis.","band":6.5,"coll":"plummet sharply"},{"w":"plateau","pos":"v","ipa":"/ˈplætəʊ/","en":"to reach a stable level after a period of increase or decrease","vi":"đạt mức ổn định sau khi tăng giảm","ex":"Growth in mobile subscriptions plateaued after the market became saturated.","band":6.5,"coll":"plateau at around"},{"w":"overtake","pos":"v","ipa":"/ˌəʊvəˈteɪk/","en":"to become greater in amount or number than something else","vi":"vượt qua","ex":"China overtook the United States as the largest car market in 2009.","band":6.5,"coll":"overtake in terms of"},{"w":"peak","pos":"v","ipa":"/piːk/","en":"to reach the highest point or value","vi":"đạt đỉnh","ex":"Petrol consumption peaked in July before falling again in August.","band":6.5,"coll":"peak at"},{"w":"marginal","pos":"adj","ipa":"/ˈmɑːdʒɪnl/","en":"very small in size, degree or importance","vi":"không đáng kể, nhỏ","ex":"There was only a marginal change in export figures that year.","band":6.5,"coll":"a marginal increase"},{"w":"dip","pos":"n","ipa":"/dɪp/","en":"a slight and usually temporary fall in a value","vi":"giảm nhẹ tạm thời","ex":"Enrolment figures dipped briefly before recovering the following term.","band":7,"coll":"a slight dip"},{"w":"gap","pos":"n","ipa":"/ɡæp/","en":"a noticeable difference between two figures, groups or periods","vi":"khoảng cách","ex":"The gap between male and female graduates has narrowed over time.","band":7,"coll":"narrow the gap"},{"w":"outnumber","pos":"v","ipa":"/ˌaʊtˈnʌmbə(r)/","en":"to exceed another group in number","vi":"vượt trội về số lượng","ex":"Female students outnumbered male students in the arts faculty by a wide margin.","band":7,"coll":"significantly outnumber"},{"w":"constitute","pos":"v","ipa":"/ˈkɒnstɪtjuːt/","en":"to make up or form a particular whole or proportion","vi":"cấu thành, chiếm","ex":"Renewable sources constituted just over a quarter of total energy output.","band":7,"coll":"constitute a majority"},{"w":"correlate","pos":"v","ipa":"/ˈkɒrəleɪt/","en":"to have a mutual relationship in which one variable affects another","vi":"có tương quan","ex":"Rising temperatures appeared to correlate closely with declining crop yields.","band":7,"coll":"correlate closely with"},{"w":"upward trend","pos":"n","ipa":"/ˈʌpwəd trend/","en":"a pattern in data showing a general increase over time","vi":"xu hướng tăng","ex":"Despite occasional dips, the graph shows a clear upward trend overall.","band":7.5,"coll":"a consistent upward trend"},{"w":"negligible","pos":"adj","ipa":"/ˈneɡlɪdʒəbl/","en":"so small or unimportant as to be not worth considering","vi":"không đáng kể","ex":"The difference between the two age groups was almost negligible.","band":7.5,"coll":"a negligible difference"},{"w":"disparity","pos":"n","ipa":"/dɪˈspærəti/","en":"a great difference or imbalance between two figures or groups","vi":"sự chênh lệch lớn","ex":"There was a marked disparity between rural and urban income levels.","band":7.5,"coll":"a wide disparity"},{"w":"converge","pos":"v","ipa":"/kənˈvɜːdʒ/","en":"to move towards a similar value or point from different directions","vi":"hội tụ, tiến sát nhau","ex":"The two lines on the graph converge sharply towards the end of the period.","band":7.5,"coll":"converge towards"}]},{"id":"academic-verbs","name":"Academic Verbs","nameVi":"Động từ học thuật","words":[{"w":"indicate","pos":"v","ipa":"/ˈɪndɪkeɪt/","en":"to show or suggest that something is the case","vi":"chỉ ra, cho thấy","ex":"The data clearly indicates a shift in consumer preferences.","band":6,"coll":"indicate a trend"},{"w":"demonstrate","pos":"v","ipa":"/ˈdemənstreɪt/","en":"to show something clearly by giving proof or evidence","vi":"chứng minh, minh chứng","ex":"The study demonstrates a strong link between diet and health.","band":6,"coll":"demonstrate that"},{"w":"contribute","pos":"v","ipa":"/kənˈtrɪbjuːt/","en":"to help cause or bring about a particular result","vi":"góp phần vào","ex":"Several factors contribute to the rising cost of housing.","band":6,"coll":"contribute significantly to"},{"w":"highlight","pos":"v","ipa":"/ˈhaɪlaɪt/","en":"to draw special attention to a particular point or issue","vi":"làm nổi bật, nhấn mạnh","ex":"This report highlights the urgent need for better public transport.","band":6,"coll":"highlight the importance of"},{"w":"suggest","pos":"v","ipa":"/səˈdʒest/","en":"to propose an idea, explanation or possibility","vi":"gợi ý, cho thấy","ex":"Recent research suggests a strong connection between sleep and memory.","band":6,"coll":"suggest that"},{"w":"address","pos":"v","ipa":"/əˈdres/","en":"to deal with or discuss a problem or issue directly","vi":"giải quyết, đề cập đến","ex":"The policy fails to address the root causes of unemployment.","band":6.5,"coll":"address an issue"},{"w":"attribute","pos":"v","ipa":"/əˈtrɪbjuːt/","en":"to say or think that something is caused by something else","vi":"quy cho, cho là do","ex":"Experts attribute the decline in bee populations to pesticide use.","band":6.5,"coll":"attribute something to"},{"w":"undermine","pos":"v","ipa":"/ˌʌndəˈmaɪn/","en":"to weaken or damage something gradually","vi":"làm suy yếu, phá hoại ngầm","ex":"Persistent absenteeism can undermine a student's academic progress.","band":6.5,"coll":"undermine confidence"},{"w":"facilitate","pos":"v","ipa":"/fəˈsɪlɪteɪt/","en":"to make an action or process easier","vi":"tạo điều kiện thuận lợi cho","ex":"Better infrastructure would facilitate trade between neighbouring countries.","band":6.5,"coll":"facilitate cooperation"},{"w":"justify","pos":"v","ipa":"/ˈdʒʌstɪfaɪ/","en":"to give a good or acceptable reason for an action or decision","vi":"biện minh, chứng minh là đúng","ex":"It is difficult to justify such heavy spending on defence.","band":6.5,"coll":"justify a decision"},{"w":"underpin","pos":"v","ipa":"/ˌʌndəˈpɪn/","en":"to form the basis or support for something","vi":"làm nền tảng cho, hỗ trợ","ex":"Strong institutions underpin a country's long-term economic stability.","band":6.5,"coll":"underpin economic growth"},{"w":"substantiate","pos":"v","ipa":"/səbˈstænʃieɪt/","en":"to provide evidence to support or prove a claim","vi":"chứng thực, làm rõ bằng chứng","ex":"The author fails to substantiate this claim with any reliable data.","band":7,"coll":"substantiate a claim"},{"w":"counteract","pos":"v","ipa":"/ˌkaʊntərˈækt/","en":"to reduce or prevent the effect of something by acting against it","vi":"chống lại, làm giảm tác động","ex":"Regular exercise can help counteract the effects of a poor diet.","band":7,"coll":"counteract the effects of"},{"w":"perpetuate","pos":"v","ipa":"/pəˈpetʃueɪt/","en":"to make a situation, belief or problem continue indefinitely","vi":"làm cho tiếp diễn, duy trì điều tiêu cực","ex":"Ignoring the issue only serves to perpetuate existing inequalities.","band":7,"coll":"perpetuate a cycle"},{"w":"reinforce","pos":"v","ipa":"/ˌriːɪnˈfɔːs/","en":"to strengthen an existing belief, feeling or habit","vi":"củng cố, tăng cường","ex":"These findings reinforce the argument for stricter environmental regulation.","band":7,"coll":"reinforce the view that"},{"w":"corroborate","pos":"v","ipa":"/kəˈrɒbəreɪt/","en":"to confirm or give support to a statement or theory","vi":"xác nhận, củng cố bằng chứng","ex":"Several independent surveys conducted last year corroborate the report's main conclusions.","band":7,"coll":"corroborate findings"},{"w":"extrapolate","pos":"v","ipa":"/ɪkˈstræpəleɪt/","en":"to estimate an unknown situation by extending known information or trends","vi":"suy rộng ra, ngoại suy","ex":"It would be unwise to extrapolate long-term trends from just two years of data.","band":7.5,"coll":"extrapolate from the data"},{"w":"conflate","pos":"v","ipa":"/kənˈfleɪt/","en":"to combine two or more things into one, often mistakenly","vi":"gộp lẫn, đánh đồng","ex":"Critics argue the report conflates correlation with causation.","band":7.5,"coll":"conflate two issues"},{"w":"delineate","pos":"v","ipa":"/dɪˈlɪnieɪt/","en":"to describe, explain or indicate something precisely","vi":"phác họa, mô tả rõ ràng","ex":"The proposal clearly delineates the responsibilities of each government department.","band":7.5,"coll":"delineate the boundaries"},{"w":"galvanise","pos":"v","ipa":"/ˈɡælvənaɪz/","en":"to shock or excite someone into taking action","vi":"thúc đẩy, kích thích hành động","ex":"The documentary galvanised public support for stricter wildlife protection laws.","band":7.5,"coll":"galvanise support"}]}]};
window.DATA_READING={"passages":[{"id":"trams","title":"The Return of the Urban Tram","topic":"Transport","level":"5.5–6.5","minutes":20,"paras":[{"label":"A","text":"At the beginning of the twentieth century, the tram was the backbone of urban transport across Europe and North America. Horse-drawn tramcars, which had run on fixed rails since the 1860s, were rapidly replaced by electric versions after the first successful electric tram network opened in Germany in 1881. By 1900, more than two hundred cities operated electric tramways, carrying millions of passengers to factories, offices and markets every day. The tram was cheap to ride, ran on a fixed and predictable route, and required no petrol, making it attractive to both passengers and city authorities."},{"label":"B","text":"The following three decades are often described as the golden age of the tram. Networks expanded rapidly, and in some cities tram lines stretched for hundreds of kilometres, linking new suburbs to the city centre. Tram companies invested heavily in double-deck carriages and covered stops to protect passengers from rain. For many working families, the tram was the only affordable way to travel any distance, and its arrival often determined where new housing was built."},{"label":"C","text":"This dominance did not last. From the early 1950s onward, city after city began removing its tram tracks. Planners argued that trams were slow and that their fixed rails blocked the flow of other traffic as private car ownership grew. Buses, unlike trams, needed no fixed infrastructure and could be rerouted overnight at little cost, so many transport authorities chose to replace entire tram fleets with bus services within a few years. Between 1955 and 1965, dozens of major cities dismantled networks that had taken half a century to build."},{"label":"D","text":"The consequences of this shift became apparent only gradually. Traffic congestion worsened as car ownership rose faster than road capacity could absorb, and air quality in city centres declined noticeably. Public transport, now dependent almost entirely on buses competing with cars for the same lanes, became slower and less reliable than the trams it had replaced. By the 1970s, some transport economists were already questioning whether the removal of tram networks had been a wise long-term decision."},{"label":"E","text":"Interest in rail-based urban transport began to return in the 1980s, spurred by rising fuel prices and growing concern about pollution. Several European cities built entirely new light-rail systems, often reusing old tram corridors that had never been built over. The first line of the modern era opened in Nantes, France, in 1985, and it proved so popular that ridership exceeded early projections within its first year. Other cities followed, and by 2005 more than one hundred cities worldwide had opened or reopened light-rail networks."},{"label":"F","text":"Modern trams differ considerably from their early twentieth-century predecessors. They are quieter, run on low-floor carriages that make boarding easier for passengers with reduced mobility, and are frequently given priority at traffic signals so that they move faster than surrounding car traffic. A single modern tram can carry as many passengers as several dozen private cars, and because electricity can be generated from renewable sources, a well-used tram line produces far less carbon dioxide per passenger than either buses or cars."},{"label":"G","text":"Building a new tram network, however, remains expensive and disruptive. Laying track through an established city centre can take years and requires digging up roads, relocating underground utility pipes, and temporarily closing shops to construction. Local businesses along the route often report a sharp fall in trade while work is under way, though most studies show that revenue recovers, and frequently increases, once the line opens. For this reason, city governments must weigh short-term disruption against the long-term benefits of a faster, cleaner and higher-capacity transport system."}],"questions":[{"type":"tfng","q":"By 1900, electric trams were operating in more than two hundred cities.","a":"TRUE","why":"Đoạn A nêu rõ: 'By 1900, more than two hundred cities operated electric tramways.'"},{"type":"tfng","q":"Bus services required significant new fixed infrastructure before they could replace trams.","a":"FALSE","why":"Đoạn C nói ngược lại: xe buýt không cần hạ tầng cố định ('needed no fixed infrastructure'), nên có thể đổi tuyến với chi phí thấp."},{"type":"tfng","q":"The removal of tram networks led to an immediate improvement in traffic flow.","a":"FALSE","why":"Đoạn D cho thấy hậu quả diễn ra dần dần và tiêu cực: tắc nghẽn giao thông tệ hơn, không khí ô nhiễm hơn, chứ không hề cải thiện ngay."},{"type":"tfng","q":"Ticket prices on modern tram lines are lower than on bus services.","a":"NOT GIVEN","why":"Bài đọc không hề so sánh giá vé giữa tram hiện đại và xe buýt, nên không có căn cứ để xác định đúng/sai."},{"type":"mcq","q":"According to paragraph A, why was the tram attractive to both passengers and city authorities?","options":["It was fast and comfortable","It ran on a fixed route and needed no petrol","It was privately funded","It replaced buses"],"a":1,"why":"Đoạn A: tram 'ran on a fixed and predictable route, and required no petrol', khiến nó hấp dẫn với cả hành khách và chính quyền."},{"type":"mcq","q":"What advantage did buses have over trams, according to paragraph C?","options":["Buses were quieter","Buses could carry more passengers","Buses could be rerouted without needing fixed infrastructure","Buses were introduced earlier than trams"],"a":2,"why":"Đoạn C: xe buýt không cần đường ray cố định nên có thể đổi tuyến qua đêm với chi phí thấp."},{"type":"mcq","q":"What made the Nantes line significant, according to paragraph E?","options":["It was the first tram line ever built","It was the first modern light-rail line, opened in 1985","It replaced the city's bus network entirely","It was funded entirely by private companies"],"a":1,"why":"Đoạn E: tuyến ở Nantes mở năm 1985 được coi là tuyến đường sắt nhẹ hiện đại đầu tiên."},{"type":"gap","q":"The first successful electric tram network opened in Germany in ______.","a":["1881"],"why":"Đoạn A nêu chính xác năm 1881."},{"type":"gap","q":"Buses needed no ______ infrastructure, so routes could be changed cheaply.","a":["fixed"],"why":"Đoạn C: 'Buses, unlike trams, needed no fixed infrastructure and could be rerouted overnight at little cost.'"},{"type":"gap","q":"Modern trams often run on ______ carriages that make boarding easier for passengers with reduced mobility.","a":["low-floor","low floor"],"why":"Đoạn F: 'run on low-floor carriages that make boarding easier for passengers with reduced mobility.'"},{"type":"match","q":"Paragraph D","group":"headings","options":["The consequences of dismantling tram networks","A worldwide return to rail-based transport","The rising cost of maintaining fixed tracks","The financial and practical costs of building new lines","The early spread of electric trams across cities"],"a":0,"why":"Đoạn D mô tả hậu quả của việc dỡ bỏ mạng lưới tram: tắc đường và ô nhiễm gia tăng."},{"type":"match","q":"Paragraph G","group":"headings","options":["The consequences of dismantling tram networks","A worldwide return to rail-based transport","The rising cost of maintaining fixed tracks","The financial and practical costs of building new lines","The early spread of electric trams across cities"],"a":3,"why":"Đoạn G tập trung vào chi phí và sự gián đoạn khi xây dựng tuyến tram mới."}]},{"id":"sleep_memory","title":"What Sleep Does to Memory","topic":"Neuroscience","level":"6.0–7.0","minutes":20,"paras":[{"label":"A","text":"For much of the twentieth century, sleep was regarded by researchers chiefly as a period of rest, a pause during which the brain used less energy and the body repaired itself. Over the past three decades, however, a large body of research has shown that sleep is not simply an absence of activity but an active process during which the brain reorganises and strengthens memories formed earlier that day. This process is now widely known as memory consolidation, and it has become one of the most active areas of neuroscience."},{"label":"B","text":"Human sleep is not uniform; it moves through distinct stages that repeat several times each night. Two stages in particular have attracted attention from memory researchers: slow-wave sleep, a deep stage marked by slow, synchronised brain waves, and rapid-eye-movement, or REM, sleep, during which brain activity resembles wakefulness even though the body remains still. Evidence suggests that slow-wave sleep is particularly important for consolidating declarative memory, that is, memory for facts and events, while REM sleep appears to play a greater role in consolidating procedural skills and emotional memories."},{"label":"C","text":"Much of what is known about the mechanics of consolidation comes from studies of the hippocampus, a small structure deep within the brain that acts as a temporary store for new information. While a person is awake, the hippocampus records the details of daily experience. During slow-wave sleep, researchers have observed that neurons in the hippocampus reactivate in patterns that closely mirror those recorded during a recent learning task, a phenomenon known as replay. This replay is thought to gradually transfer information from the hippocampus to the cortex, where memories can be stored more permanently."},{"label":"D","text":"Behavioural experiments in humans support this picture. In one widely cited design, volunteers learned a list of paired words or a sequence of finger movements in the evening. Half were tested after a full night of sleep, and half after remaining awake for a similar period during the day. Across many such studies, the sleep group consistently recalled more items, often between twenty and forty percent more, than the group that stayed awake, even though both groups had the same amount of time between learning and testing."},{"label":"E","text":"Sleep does not only protect memories that have already been formed; it also affects the brain's capacity to form new ones. Volunteers who are deprived of sleep before a learning session, rather than after it, show measurably poorer encoding of new material, as though the hippocampus itself becomes less able to register new information without adequate rest. This finding suggests that a single night of poor sleep can weaken memory formation on the following day, independent of any effect on memories formed earlier."},{"label":"F","text":"These findings have practical implications, particularly for groups whose sleep patterns change with age. Older adults typically spend less time in slow-wave sleep than younger adults, and several studies have linked this reduction to poorer performance on tests of declarative memory. Some researchers have proposed that short daytime naps, which can include periods of slow-wave sleep, may partly offset this loss, though the evidence for naps as a routine intervention remains preliminary and requires larger trials before firm conclusions can be drawn."},{"label":"G","text":"Despite the strength of the evidence linking sleep to memory, important questions remain unresolved. Much of the hippocampal replay research has been conducted in rodents, and while human brain-imaging studies show broadly similar patterns, direct evidence in humans is harder to obtain. Researchers also note considerable variation between individuals in how much benefit sleep provides, and it is not yet clear whether this variation reflects differences in sleep quality, genetics, or the type of memory being tested."}],"questions":[{"type":"tfng","q":"Sleep was once regarded mainly as a passive state in which the brain was largely inactive.","a":"TRUE","why":"Đoạn A: trước đây sleep được xem là 'a period of rest, a pause during which the brain used less energy', tức là trạng thái thụ động."},{"type":"tfng","q":"REM sleep and slow-wave sleep contribute equally to every type of memory.","a":"FALSE","why":"Đoạn B phân biệt rõ: slow-wave sleep quan trọng hơn cho trí nhớ khai báo, còn REM sleep quan trọng hơn cho kỹ năng và cảm xúc, chứ không đóng góp như nhau."},{"type":"tfng","q":"The hippocampus permanently stores all long-term memories.","a":"FALSE","why":"Đoạn C nói hippocampus chỉ là nơi lưu trữ tạm thời; thông tin được chuyển sang cortex để lưu trữ lâu dài hơn."},{"type":"tfng","q":"Researchers have identified the exact number of hours of slow-wave sleep needed to maximise memory retention.","a":"NOT GIVEN","why":"Bài đọc không đề cập đến một con số giờ cụ thể nào được xác định là tối ưu, nên không có căn cứ để kết luận đúng/sai."},{"type":"mcq","q":"According to paragraph C, what is 'replay'?","options":["A method of testing memory recall","The reactivation of neuron patterns during sleep that mirror earlier learning","A stage of REM sleep","A technique for measuring brain waves"],"a":1,"why":"Đoạn C định nghĩa 'replay' là việc neuron trong hippocampus tái kích hoạt theo mô hình giống lúc học."},{"type":"mcq","q":"What did the experiment described in paragraph D find?","options":["Sleep had no measurable effect on recall","The awake group recalled more than the sleep group","The sleep group recalled significantly more items than the awake group","Both groups performed identically"],"a":2,"why":"Đoạn D: nhóm được ngủ nhớ lại nhiều hơn từ 20-40% so với nhóm thức."},{"type":"mcq","q":"According to paragraph E, sleep deprivation before a learning session mainly affects:","options":["the ability to recall memories formed years earlier","the brain's ability to encode new information","the length of REM sleep","the accuracy of behavioural experiments"],"a":1,"why":"Đoạn E: thiếu ngủ trước khi học làm giảm khả năng 'encoding' (mã hóa) thông tin mới."},{"type":"gap","q":"Two stages important for memory researchers are slow-wave sleep and ______ sleep.","a":["rem"],"why":"Đoạn B nêu 'rapid-eye-movement, or REM, sleep' là một trong hai giai đoạn quan trọng."},{"type":"gap","q":"Reactivation of hippocampal neuron patterns during sleep is known as ______.","a":["replay"],"why":"Đoạn C gọi hiện tượng này là 'replay'."},{"type":"gap","q":"Volunteers deprived of sleep before learning show poorer ______ of new material.","a":["encoding"],"why":"Đoạn E: 'show measurably poorer encoding of new material.'"},{"type":"match","q":"Paragraph B","group":"headings","options":["A hidden process behind mental rest","Two kinds of sleep, two kinds of memory","Evidence from a memory-transfer structure","Sleep loss and its cost for learning ahead","Unanswered questions about individual differences"],"a":1,"why":"Đoạn B so sánh vai trò khác nhau của slow-wave sleep và REM sleep đối với các loại trí nhớ khác nhau."},{"type":"match","q":"Paragraph E","group":"headings","options":["A hidden process behind mental rest","Two kinds of sleep, two kinds of memory","Evidence from a memory-transfer structure","Sleep loss and its cost for learning ahead","Unanswered questions about individual differences"],"a":3,"why":"Đoạn E nói về việc thiếu ngủ trước khi học làm giảm khả năng ghi nhớ thông tin mới trong ngày hôm sau."}]},{"id":"coffee_bean","title":"The Long Journey of a Coffee Bean","topic":"Agriculture","level":"6.0–7.0","minutes":20,"paras":[{"label":"A","text":"The coffee plant is believed to have originated in the highland forests of what is now Ethiopia, where wild Coffea arabica trees still grow today. According to local tradition, farmers first noticed the stimulating effect of the plant's red cherries centuries ago, although the earliest reliable written records of coffee drinking date only to the fifteenth century, when the practice had already spread to Yemen. From the Arabian Peninsula, coffee cultivation and trade gradually extended along established shipping and caravan routes, reaching Europe by the early seventeenth century."},{"label":"B","text":"Commercial coffee production today is concentrated within a band of land roughly between the Tropic of Cancer and the Tropic of Capricorn, an area often called the coffee belt because it provides the warm temperatures and regular rainfall the plant requires. Within this belt, altitude has a strong influence on quality and species. Arabica, which accounts for roughly sixty percent of world production, generally grows best above six hundred metres, where cooler nights slow the ripening of the cherry and allow more complex flavours to develop; the hardier robusta species tolerates lower, hotter growing regions."},{"label":"C","text":"Coffee cherries do not all ripen at the same time, so on many farms they are still picked by hand, one cherry at a time, to ensure that only fully ripe, red fruit is collected. Depending on the region and variety grown, a single farm may be harvested once a year or, in some equatorial areas, two or three times. Cherries picked too early or left too long on the branch tend to yield beans with unbalanced flavours, so timing the harvest correctly is one of the most labour-intensive parts of coffee production."},{"label":"D","text":"Once picked, cherries must be processed quickly, usually within twenty-four hours, to prevent spoilage. Two methods dominate. In the washed method, the outer skin and fruit pulp are removed by machine, and the beans are then fermented in tanks of water for one or two days to loosen a sticky layer before being rinsed and dried. In the natural method, whole cherries are simply spread out and dried in the sun, with the fruit removed only afterward; this method requires less water but demands careful, constant turning to prevent mould."},{"label":"E","text":"Dried, unroasted beans, known in the trade as green coffee, are then bagged and exported, often to a small number of countries that dominate global roasting and consumption. The price paid to farmers is heavily influenced by international commodity markets, particularly the New York C contract, a benchmark that sets a reference price which can shift sharply within a single season due to weather, currency movements or speculative trading. Because a large share of the world's coffee is grown by smallholder farmers with only a few hectares of land, this price volatility can have an outsized effect on household income in producing countries."},{"label":"F","text":"The character of a cup of coffee is shaped as much by what happens after export as by the growing conditions themselves. Roasting transforms green beans, which have little aroma, into the dark, fragrant beans familiar to consumers, through a chemical process that develops hundreds of flavour compounds. A lighter roast tends to preserve the more delicate, fruity notes associated with the bean's origin, while a darker roast produces bolder, more bitter flavours that can mask regional differences between beans grown thousands of kilometres apart."},{"label":"G","text":"In response to concerns about farmer income, a number of certification schemes have emerged over the past three decades, offering labels such as fair trade and organic to consumers willing to pay a premium. These schemes typically guarantee a minimum price or an additional payment above the market rate, and require farms to meet specific environmental or labour standards. Even so, certified coffee still represents a relatively small proportion of total global production, and researchers continue to debate how much of the premium consumers pay actually reaches the farmers who grew the beans."}],"questions":[{"type":"tfng","q":"The earliest reliable written records of coffee drinking date from the fifteenth century.","a":"TRUE","why":"Đoạn A nêu rõ: 'the earliest reliable written records of coffee drinking date only to the fifteenth century.'"},{"type":"tfng","q":"Robusta coffee is generally grown at higher altitudes than arabica.","a":"FALSE","why":"Đoạn B nói ngược lại: arabica phát triển tốt nhất ở độ cao trên 600m, còn robusta chịu được vùng thấp và nóng hơn."},{"type":"tfng","q":"All coffee farms harvest their cherries only once a year.","a":"FALSE","why":"Đoạn C cho biết một số vùng xích đạo thu hoạch hai hoặc ba lần một năm, không phải luôn chỉ một lần."},{"type":"tfng","q":"Robusta beans typically sell for a higher price than arabica beans on international markets.","a":"NOT GIVEN","why":"Bài đọc không so sánh giá bán giữa robusta và arabica, chỉ nói về tỉ trọng sản lượng và độ cao trồng, nên không có căn cứ để xác định."},{"type":"mcq","q":"According to paragraph B, why does arabica coffee often develop more complex flavours?","options":["It is grown using the natural method","Cooler nights at higher altitude slow the ripening of the cherry","It is picked several times a year","It is fermented for longer than robusta"],"a":1,"why":"Đoạn B: đêm mát ở độ cao lớn làm chậm quá trình chín của quả, giúp hương vị phức tạp hơn."},{"type":"mcq","q":"According to paragraph D, what is the main difference between the washed and natural methods?","options":["The washed method uses no water at all","The natural method removes the fruit before drying","The washed method removes the skin and pulp before fermentation, while the natural method dries the whole cherry first","The natural method takes place only in tanks of water"],"a":2,"why":"Đoạn D mô tả: phương pháp washed loại bỏ vỏ và cùi trước khi lên men, còn natural phơi khô cả quả rồi mới loại bỏ phần thịt quả."},{"type":"mcq","q":"According to paragraph F, what effect does a darker roast tend to have?","options":["It preserves delicate, fruity notes","It produces bolder, more bitter flavours that can mask regional differences","It increases the aroma of green beans before roasting","It has no effect on flavour"],"a":1,"why":"Đoạn F: rang đậm tạo hương vị đậm và đắng hơn, có thể che lấp sự khác biệt vùng miền."},{"type":"gap","q":"Wild coffee trees are believed to have originated in the highland forests of ______.","a":["ethiopia"],"why":"Đoạn A: 'the highland forests of what is now Ethiopia.'"},{"type":"gap","q":"Coffee cherries must be processed within ______ to prevent spoilage.","a":["twenty-four hours","24 hours"],"why":"Đoạn D: 'processed quickly, usually within twenty-four hours, to prevent spoilage.'"},{"type":"gap","q":"Certification schemes such as fair trade typically guarantee a minimum ______ to farmers.","a":["price"],"why":"Đoạn G: 'guarantee a minimum price or an additional payment above the market rate.'"},{"type":"match","q":"Paragraph D","group":"headings","options":["From wild forest plant to global trade","Where geography shapes bean quality","Turning cherries into dry, storable beans","How roasting determines the final taste","Guaranteeing a fairer income for growers"],"a":2,"why":"Đoạn D mô tả hai phương pháp chế biến quả cà phê thành hạt khô để bảo quản."},{"type":"match","q":"Paragraph G","group":"headings","options":["From wild forest plant to global trade","Where geography shapes bean quality","Turning cherries into dry, storable beans","How roasting determines the final taste","Guaranteeing a fairer income for growers"],"a":4,"why":"Đoạn G nói về các chương trình chứng nhận nhằm đảm bảo thu nhập công bằng hơn cho nông dân."}]},{"id":"deep_sea_light","title":"Light in the Deep Ocean","topic":"Marine biology","level":"7.0–8.0","minutes":20,"paras":[{"label":"A","text":"Beyond a depth of roughly one thousand metres, sunlight can no longer penetrate ocean water, and to a human observer the environment appears entirely black. Yet the deep sea is far from dark. Surveys conducted from submersibles suggest that the majority of animals living at these depths are capable of producing their own light, a phenomenon known as bioluminescence. Far from being a rare curiosity, bioluminescence is now regarded by marine biologists as one of the dominant forms of communication and interaction in the largest habitat on the planet."},{"label":"B","text":"Bioluminescence is fundamentally a chemical process. In most cases, a molecule called luciferin reacts with oxygen in the presence of an enzyme, luciferase, releasing energy almost entirely as light rather than heat, which is why the phenomenon is sometimes referred to as cold light. Some organisms manufacture these chemicals within their own cells, while others, including many species of squid and fish, instead host colonies of luminous bacteria within specialised organs, effectively outsourcing light production to a symbiotic partner that receives nutrients and shelter in return."},{"label":"C","text":"Estimates vary depending on the survey method used, but several long-term studies of midwater organisms captured on camera below six hundred metres suggest that at least three-quarters of individuals encountered are luminous to some degree. This capacity is not confined to a single group; it has evolved independently many times across jellyfish, crustaceans, squid, and fish, a pattern that strongly suggests light production confers a substantial survival advantage in an environment where it is otherwise the only visual cue available."},{"label":"D","text":"One of the more subtle uses of bioluminescence is a form of camouflage known as counterillumination. Many mid-water fish and squid possess rows of light-producing organs, called photophores, along their undersides. By adjusting the intensity of this downward-facing light to match the faint sunlight filtering down from above, an animal can erase its own silhouette when viewed from below, making it effectively invisible to predators hunting by looking upward for dark shapes against the brighter surface waters."},{"label":"E","text":"Bioluminescence also plays an active role in predation. The anglerfish is perhaps the best-known example: a modified spine tipped with a luminous lure, dangled in front of the mouth, draws curious prey within striking distance. Other species use light defensively rather than offensively, releasing a sudden, blinding flash to disorient an attacking predator, or ejecting a cloud of luminous particles that drifts away as a glowing decoy, buying the fleeing animal a crucial few seconds to escape into darkness."},{"label":"F","text":"A further function, less well understood than camouflage or predation, is communication between members of the same species. Certain small crustaceans called ostracods produce brief, precisely timed pulses of light that differ from species to species, apparently allowing males to signal their identity and location to potential mates in complete darkness. Because observing such behaviour in the deep sea is technically difficult, researchers suspect that many other signalling functions of bioluminescence remain undocumented."},{"label":"G","text":"Almost all bioluminescence observed in the ocean falls within a narrow blue-green range of wavelengths, since blue light travels farthest through seawater and matches the narrow range of colours that deep-sea eyes have evolved to detect. A striking exception is the stoplight loosejaw, a fish that produces red light despite the near-total absence of red-sensitive vision among its neighbours; because almost nothing else in the deep sea can perceive red light, the loosejaw is thought to use it as a private channel, illuminating prey without revealing its own position."},{"label":"H","text":"Beyond its ecological significance, bioluminescence has proved unexpectedly valuable to science. Luciferase enzymes isolated from luminous organisms are now widely used in laboratories as reporter genes, allowing researchers to track when and where a particular gene is switched on inside living cells simply by observing where light is produced. What began as a puzzle of deep-sea biology has become an indispensable tool in fields as varied as cancer research and drug development."}],"questions":[{"type":"tfng","q":"Below approximately one thousand metres, sunlight can no longer reach the ocean.","a":"TRUE","why":"Đoạn A: 'Beyond a depth of roughly one thousand metres, sunlight can no longer penetrate ocean water.'"},{"type":"tfng","q":"All bioluminescent organisms manufacture their light-producing chemicals within their own cells.","a":"FALSE","why":"Đoạn B nói một số loài lại dựa vào vi khuẩn phát quang cộng sinh sống trong cơ quan chuyên biệt, không tự sản xuất hóa chất."},{"type":"tfng","q":"Counterillumination makes an animal easier to see by predators hunting below it.","a":"FALSE","why":"Đoạn D cho thấy counterillumination làm mất bóng của con vật, khiến nó khó bị phát hiện hơn bởi kẻ săn mồi nhìn từ dưới lên, chứ không phải dễ thấy hơn."},{"type":"tfng","q":"The stoplight loosejaw was the first bioluminescent fish species to be discovered by scientists.","a":"NOT GIVEN","why":"Bài đọc không đề cập đến lịch sử phát hiện loài cá này, nên không có căn cứ để xác định đúng/sai."},{"type":"mcq","q":"According to paragraph B, why is bioluminescence sometimes called 'cold light'?","options":["It occurs only in cold deep-sea water","The chemical reaction releases energy almost entirely as light rather than heat","It requires freezing temperatures to occur","Luciferin is a cold substance"],"a":1,"why":"Đoạn B: phản ứng hóa học giải phóng năng lượng gần như hoàn toàn dưới dạng ánh sáng chứ không phải nhiệt."},{"type":"mcq","q":"According to paragraph D, how does counterillumination protect an animal?","options":["By producing a sudden bright flash to blind predators","By releasing a cloud of glowing particles as a decoy","By matching downward light intensity to erase its silhouette against surface light","By attracting prey close enough to strike"],"a":2,"why":"Đoạn D: ánh sáng hướng xuống được điều chỉnh khớp với ánh sáng mặt trời yếu ớt từ trên, xóa bóng của con vật."},{"type":"mcq","q":"Why is the stoplight loosejaw's red light considered unusual, according to paragraph G?","options":["Red light travels farther through water than blue light","Most deep-sea animals cannot perceive red light, so it functions as a private channel","It is the only fish capable of producing light","Red light requires far more energy to produce than blue light"],"a":1,"why":"Đoạn G: hầu hết sinh vật biển sâu không nhìn thấy ánh sáng đỏ, nên loài cá này dùng nó như một kênh riêng."},{"type":"gap","q":"Luciferin reacts with oxygen in the presence of an enzyme called ______.","a":["luciferase"],"why":"Đoạn B nêu rõ tên enzyme là 'luciferase'."},{"type":"gap","q":"Rows of light-producing organs called ______ are found along the undersides of many mid-water fish and squid.","a":["photophores"],"why":"Đoạn D: 'rows of light-producing organs, called photophores, along their undersides.'"},{"type":"gap","q":"Small crustaceans called ______ produce timed pulses of light to signal potential mates.","a":["ostracods"],"why":"Đoạn F: 'Certain small crustaceans called ostracods produce brief, precisely timed pulses of light.'"},{"type":"match","q":"Paragraph E","group":"headings","options":["A chemical reaction that makes cold light","Vanishing from view by matching the light above","Luring and startling in the dark","A rare use of red instead of blue","From ocean mystery to laboratory tool"],"a":2,"why":"Đoạn E nói về việc dùng ánh sáng để dụ mồi (anglerfish) và làm chói mắt kẻ săn mồi."},{"type":"match","q":"Paragraph H","group":"headings","options":["A chemical reaction that makes cold light","Vanishing from view by matching the light above","Luring and startling in the dark","A rare use of red instead of blue","From ocean mystery to laboratory tool"],"a":4,"why":"Đoạn H nói về việc ứng dụng enzyme luciferase trong nghiên cứu khoa học và y học."}]}]};
window.DATA_LISTENING={"sections":[{"id":"p1-sports-centre","part":1,"title":"Joining a sports centre","titleVi":"Đăng ký trung tâm thể thao","level":"4.5–5.5","script":[{"sp":"Receptionist","voice":"m","text":"Good afternoon, Fairfield Leisure Centre, this is Tom speaking. How can I help you today?"},{"sp":"Caller","voice":"f","text":"Hi Tom, I'd like to find out about joining as a member, please."},{"sp":"Receptionist","voice":"m","text":"Of course, I can help with that. Let me just take a few details first. Could I get your full name, please?"},{"sp":"Caller","voice":"f","text":"Yes, it's Rachel Coleman."},{"sp":"Receptionist","voice":"m","text":"Thanks. Could you spell your surname for me?"},{"sp":"Caller","voice":"f","text":"Sure, that's C-O-L-E-M-A-N, Coleman."},{"sp":"Receptionist","voice":"m","text":"Great, thanks Rachel. And could I take your address, just the house number and postcode is fine?"},{"sp":"Caller","voice":"f","text":"It's number 14, and the postcode is BR3 9QL."},{"sp":"Receptionist","voice":"m","text":"Perfect. Now, we have two main membership options. There's an off-peak membership, which is cheaper but only lets you use the centre before 4pm on weekdays, and there's a full membership, which gives you access any time, including weekends. Which one would you like?"},{"sp":"Caller","voice":"f","text":"The off-peak price is tempting, but actually, since I work shifts, I think I'll need the full membership so I can come at weekends too."},{"sp":"Receptionist","voice":"m","text":"No problem, I'll set you up with full membership. That's normally £52 a month — sorry, hold on, I'm reading the wrong price list, it's actually £49 a month at the moment because of our new member offer."},{"sp":"Caller","voice":"f","text":"Oh, that's better, thank you."},{"sp":"Receptionist","voice":"m","text":"Before you start, everyone has to attend a short induction session, just to learn how to use the equipment safely. We run those on Tuesdays at 6pm... actually, sorry, let me check again — it's on Thursdays at 6pm now, the Tuesday slot was cancelled last month."},{"sp":"Caller","voice":"f","text":"Thursday at 6, got it."},{"sp":"Receptionist","voice":"m","text":"And when would you like your membership to start?"},{"sp":"Caller","voice":"f","text":"Could I start on the 3rd of March, please?"},{"sp":"Receptionist","voice":"m","text":"The 3rd of March, sure, I'll note that down. Now, is there a particular class you're interested in? We currently offer yoga, swimming, boxing and pilates."},{"sp":"Caller","voice":"f","text":"I was thinking about yoga, but actually a friend of mine recommended the pilates class, so I'll go with pilates instead."},{"sp":"Receptionist","voice":"m","text":"Great choice, pilates is very popular here. Could I also take a contact phone number, in case we need to reach you?"},{"sp":"Caller","voice":"f","text":"Yes, it's 07924, then 561883."},{"sp":"Receptionist","voice":"m","text":"So that's 07924 561883, is that right?"},{"sp":"Caller","voice":"f","text":"Yes, that's correct."},{"sp":"Receptionist","voice":"m","text":"Lastly, would you like to rent a locker? It's an extra £5 a month if you'd like your own permanent locker instead of the free ones."},{"sp":"Caller","voice":"f","text":"Yes, I'll take a locker, please."},{"sp":"Receptionist","voice":"m","text":"And how would you like to pay — by card, cash, or bank transfer?"},{"sp":"Caller","voice":"f","text":"I'll pay by card, please."},{"sp":"Receptionist","voice":"m","text":"Perfect, that's everything I need. Welcome to Fairfield Leisure Centre, Rachel!"},{"sp":"Caller","voice":"f","text":"Thanks very much, Tom, see you soon."}],"questions":[{"type":"gap","q":"Family name: ______","a":["coleman"],"why":"Người gọi đánh vần tên họ 'C-O-L-E-M-A-N' ngay sau khi giới thiệu tên đầy đủ Rachel Coleman."},{"type":"gap","q":"House number: ______","a":["14"],"why":"Cô ấy nói địa chỉ 'number 14' ngay sau phần đánh vần tên họ."},{"type":"mcq","q":"Which membership does the caller choose?","options":["Off-peak membership","Full membership","Student membership","Family membership"],"a":1,"why":"Nhân viên nhắc đến off-peak trước, nhưng khách nói vì làm ca nên cần full membership để đi được cả cuối tuần — đây là bẫy nhắc phương án sai trước."},{"type":"gap","q":"Monthly membership fee: £______","a":["49"],"why":"Nhân viên nói nhầm giá 52 bảng rồi sửa lại ngay là 49 bảng vì có ưu đãi hội viên mới — chú ý bẫy sửa số."},{"type":"mcq","q":"Which day is the induction session held?","options":["Monday","Tuesday","Wednesday","Thursday"],"a":3,"why":"Nhân viên nói buổi hướng dẫn vào thứ Ba trước, sau đó sửa lại là thứ Năm vì buổi thứ Ba đã bị huỷ — bẫy sửa lời thứ hai trong bài."},{"type":"gap","q":"Membership start date: ______","a":["3rd march","march 3rd","3 march","march 3","3rd of march"],"why":"Khách yêu cầu bắt đầu từ '3rd of March' và nhân viên nhắc lại để xác nhận."},{"type":"mcq","q":"Which class does the caller sign up for?","options":["Yoga","Swimming","Boxing","Pilates"],"a":3,"why":"Khách định học yoga nhưng đổi ý chọn pilates theo lời giới thiệu của bạn — bẫy nhắc lựa chọn đầu sai trước khi chốt đáp án."},{"type":"gap","q":"Contact phone number: ______","a":["07924 561883","07924561883"],"why":"Khách đọc số điện thoại thành hai phần '07924' rồi '561883', nhân viên nhắc lại nguyên số để xác nhận."},{"type":"gap","q":"Locker rental fee: £______ per month","a":["5"],"why":"Nhân viên báo giá thuê tủ riêng là thêm 5 bảng mỗi tháng."},{"type":"mcq","q":"How will the caller pay?","options":["Card","Cash","Bank transfer","Direct debit"],"a":0,"why":"Khách chọn thanh toán bằng thẻ khi được hỏi ba lựa chọn cuối cùng."}]},{"id":"p2-farmers-market","part":2,"title":"Volunteering at a farmers' market","titleVi":"Tình nguyện tại chợ nông sản cuối tuần","level":"5.0–6.0","script":[{"sp":"Guide","voice":"f","text":"Hi everyone, and welcome to your first day as a volunteer! I'm going to give you a quick introduction to how the market works before your shift starts."},{"sp":"Guide","voice":"f","text":"This is the Riverside Farmers' Market, and it's been running every Saturday morning here by the river for almost ten years now, rain or shine."},{"sp":"Guide","voice":"f","text":"Before we get started, let's talk about where you should meet each week. In the past, volunteers used to meet by the main gate, but we've actually moved the meeting point — from now on, please come straight to the information tent, that's the big white tent near the entrance, and check in with whoever is on duty there."},{"sp":"Guide","voice":"f","text":"The market opens to the public at 9 o'clock — actually, sorry, let me correct that, it's 8:30, not 9, we changed the opening time last month so that people can shop before it gets too crowded. So please make sure you arrive by 8 o'clock at the latest to help the stallholders set up."},{"sp":"Guide","voice":"f","text":"Speaking of stallholders, we currently have around 40 stalls booked in for this weekend — no wait, I need to double check that, it's actually 35 stalls this week, a few of our regular sellers couldn't make it. You'll see everything from fresh vegetables and fruit to homemade bread, cheese, honey and flowers."},{"sp":"Guide","voice":"f","text":"Now, about your uniform. All market staff wear red vests, but volunteers wear yellow vests instead, so that visitors can easily tell who to ask for help. You'll find your vest in the information tent when you arrive."},{"sp":"Guide","voice":"f","text":"If visitors ask about parking, just let them know there's a car park just behind the market, and it costs £3 for the whole day, no matter how long they stay."},{"sp":"Guide","voice":"f","text":"One really important thing — if a child goes missing, please don't try to search for them on your own. Take the parent straight to the information tent and radio the market manager immediately, so we can make an announcement and start looking together as a team."},{"sp":"Guide","voice":"f","text":"Your main supervisor today is Diane Whitfield — that's spelled W-H-I-T-F-I-E-L-D — and she'll be around all morning if you have any questions."},{"sp":"Guide","voice":"f","text":"At the information desk itself, your main job will be answering general questions and handing out our free market maps, rather than handling any money, so don't worry, you won't need to deal with cash at all."},{"sp":"Guide","voice":"f","text":"And finally, the market closes to the public at 1 o'clock, so we'll ask everyone to start packing away from about 12:45. Thanks so much for volunteering today, I really appreciate it, and let's get started!"}],"questions":[{"type":"gap","q":"The market is called the ______ Farmers' Market","a":["riverside"],"why":"Ngay đầu bài, hướng dẫn viên giới thiệu đây là Riverside Farmers' Market, họp mỗi sáng thứ Bảy."},{"type":"mcq","q":"Where should new volunteers meet before their shift?","options":["Main gate","Car park","Information tent","Cafe"],"a":2,"why":"Cô nói trước đây tập trung ở cổng chính (main gate) nhưng đã đổi điểm hẹn sang information tent — bẫy nhắc địa điểm cũ trước khi sửa."},{"type":"gap","q":"The market opens to the public at ______","a":["8:30","8.30","half past eight"],"why":"Hướng dẫn viên nói 9 giờ trước rồi sửa ngay lại là 8:30 vì đổi giờ mở cửa từ tháng trước — bẫy sửa giờ."},{"type":"gap","q":"Number of stalls booked this weekend: ______","a":["35"],"why":"Cô nói 40 gian hàng trước, sau đó sửa lại là 35 vì vài người bán không đến được — bẫy sửa số."},{"type":"mcq","q":"What colour vest must volunteers wear?","options":["Red","Green","Yellow","Blue"],"a":2,"why":"Nhân viên chính thức mặc áo đỏ, còn tình nguyện viên mặc áo vàng — bẫy nhắc màu của nhân viên trước."},{"type":"gap","q":"Car park charge for visitors: £______ per day","a":["3"],"why":"Hướng dẫn viên nói phí gửi xe là 3 bảng cho cả ngày, không tính theo giờ."},{"type":"mcq","q":"What should volunteers do if a child goes missing?","options":["Search for the child alone","Call the police immediately","Take the parent to the information tent and radio the manager","Make an announcement themselves"],"a":2,"why":"Cô nhấn mạnh không được tự đi tìm mà phải đưa phụ huynh đến lều thông tin và gọi bộ đàm cho quản lý ngay."},{"type":"gap","q":"Supervisor's surname: ______","a":["whitfield"],"why":"Tên người giám sát được nhắc và đánh vần rõ 'W-H-I-T-F-I-E-L-D', Diane Whitfield."},{"type":"mcq","q":"What is the volunteers' main task at the information desk?","options":["Selling tickets","Handling cash payments","Answering questions and giving out maps","Managing the stallholders"],"a":2,"why":"Công việc chính ở bàn thông tin là trả lời câu hỏi và phát bản đồ miễn phí, không xử lý tiền mặt."},{"type":"mcq","q":"What time does the market close?","options":["12:45","1 o'clock","1:30","2 o'clock"],"a":1,"why":"Chợ đóng cửa lúc 1 giờ, còn 12:45 chỉ là giờ bắt đầu dọn dẹp — dễ nhầm giữa hai mốc thời gian gần nhau."}]},{"id":"p3-travel-survey","part":3,"title":"Researching student travel habits","titleVi":"Khảo sát thói quen đi lại của sinh viên","level":"6.5–7.5","script":[{"sp":"Dr Carter","voice":"f","text":"Thanks for coming in, Mark, Priya. I wanted to catch up on your research proposal about student travel habits before you submit it. So, remind me, what's the main aim of the project again?"},{"sp":"Mark","voice":"m","text":"Basically, we want to find out how students usually travel to campus — whether they walk, cycle, drive, or use public transport — and what factors influence that choice, like cost or distance."},{"sp":"Dr Carter","voice":"f","text":"Good, that's a nice clear aim. And who exactly are you planning to survey?"},{"sp":"Priya","voice":"f","text":"We were originally going to survey all students, including postgraduates, but we've decided to just focus on undergraduate students, since their travel patterns tend to be more similar and it keeps the sample more manageable."},{"sp":"Dr Carter","voice":"f","text":"That makes sense for a project this size. How are you planning to collect the data?"},{"sp":"Mark","voice":"m","text":"Our first idea was to hand out paper questionnaires outside the library, but honestly, after thinking it through, we've decided an online survey would be much more efficient — we can reach more students and it's easier to analyse the results afterwards."},{"sp":"Dr Carter","voice":"f","text":"Yes, I agree, online is definitely the way to go for this. Now, I noticed you referenced a similar study in your literature review — who was that by again?"},{"sp":"Priya","voice":"f","text":"That was a study by a researcher called Sanderson — that's spelled S-A-N-D-E-R-S-O-N — from a few years ago, looking at commuting patterns at another university."},{"sp":"Dr Carter","voice":"f","text":"Right, I remember that one. One weakness of that Sanderson study was that the sample size was far too small to draw reliable conclusions, so make sure yours is bigger and more representative."},{"sp":"Mark","voice":"m","text":"We were actually planning for around 200 responses, but after talking to our supervisor, we've scaled that down to 150, since that should still be enough for meaningful analysis given our timeline."},{"sp":"Dr Carter","voice":"f","text":"150 sounds reasonable. Before you send the full survey out, I'd really recommend running a small pilot test first, just to check the questions are clear."},{"sp":"Priya","voice":"f","text":"Yes, we're planning to run the pilot on Monday — oh wait, actually, sorry, we moved it to Wednesday, because the classroom we needed wasn't free on Monday."},{"sp":"Dr Carter","voice":"f","text":"Wednesday's fine. And just to confirm, when is your proposal due at the ethics committee?"},{"sp":"Mark","voice":"m","text":"We need to submit it by the 20th of November, so we're not too far off now."},{"sp":"Dr Carter","voice":"f","text":"Okay, that gives you a bit of time. One more thing — response rates for online surveys can be quite low, so I'd suggest offering a small incentive, maybe a £10 voucher for anyone who completes it, just to encourage more people to take part."},{"sp":"Priya","voice":"f","text":"That's a great idea, we'll add that to the plan. Thanks so much for your feedback, Dr Carter."},{"sp":"Dr Carter","voice":"f","text":"No problem, good luck with it — let me know how the pilot goes."}],"questions":[{"type":"mcq","q":"What is the main aim of the project?","options":["To compare travel costs between cities","To find out how students travel to campus and what influences their choice","To test a new bus route for the university","To measure how much students spend on transport"],"a":1,"why":"Mark nêu rõ mục tiêu ngay từ đầu: tìm hiểu sinh viên đi lại bằng phương tiện gì và yếu tố nào ảnh hưởng đến lựa chọn đó."},{"type":"mcq","q":"Who will the researchers survey?","options":["All students, including postgraduates","Undergraduate students only","Postgraduate students only","University staff and students"],"a":1,"why":"Priya nói ban đầu định khảo sát tất cả sinh viên kể cả sau đại học, nhưng đã đổi thành chỉ sinh viên đại học — bẫy nhắc phương án cũ trước."},{"type":"mcq","q":"Why do they prefer an online survey to paper questionnaires?","options":["It is cheaper to run","It helps them reach more students and analyse results more easily","Their supervisor insisted on it","It requires less preparation time"],"a":1,"why":"Mark kể ý tưởng ban đầu là phát phiếu giấy, nhưng đổi sang khảo sát online vì tiếp cận được nhiều sinh viên hơn và dễ phân tích kết quả hơn."},{"type":"gap","q":"Researcher of the earlier study referenced: ______","a":["sanderson"],"why":"Priya nhắc đến và đánh vần tên nghiên cứu trước đó: 'S-A-N-D-E-R-S-O-N', Sanderson."},{"type":"mcq","q":"What weakness did Dr Carter identify in the Sanderson study?","options":["The questions were poorly worded","The sample size was too small","The study was too recent","The researcher didn't publish the results"],"a":1,"why":"Dr Carter chỉ ra điểm yếu là cỡ mẫu của nghiên cứu Sanderson quá nhỏ để rút ra kết luận đáng tin cậy."},{"type":"gap","q":"Target number of survey responses: ______","a":["150"],"why":"Mark nói ban đầu định lấy khoảng 200 phản hồi, nhưng sau khi trao đổi với người hướng dẫn đã giảm xuống còn 150 — bẫy sửa số."},{"type":"mcq","q":"Which day will the pilot test now take place?","options":["Monday","Tuesday","Wednesday","Thursday"],"a":2,"why":"Priya nói ban đầu định chạy thử vào thứ Hai nhưng đổi sang thứ Tư vì phòng học không trống — bẫy sửa lời."},{"type":"gap","q":"Deadline to submit the proposal to the ethics committee: ______","a":["20th november","20 november","november 20","20th of november","nov 20"],"why":"Mark xác nhận hạn nộp đề xuất cho hội đồng đạo đức là ngày 20 tháng 11."},{"type":"gap","q":"Suggested incentive voucher value: £______","a":["10"],"why":"Dr Carter đề xuất tặng phiếu quà tặng trị giá 10 bảng cho người hoàn thành khảo sát."},{"type":"mcq","q":"Why does Dr Carter suggest offering an incentive?","options":["To reward students financially","To increase the response rate","To comply with university ethics rules","To reduce the researchers' workload"],"a":1,"why":"Bà giải thích tỷ lệ phản hồi khảo sát online thường thấp, nên phiếu quà tặng sẽ khuyến khích thêm nhiều người tham gia."}]},{"id":"p4-urban-farming","part":4,"title":"Urban farming","titleVi":"Nông nghiệp đô thị","level":"6.5–7.5","script":[{"sp":"Professor Hughes","voice":"m","text":"Good morning everyone. Today I want to talk about urban farming, which is simply the practice of growing fruit, vegetables and sometimes even fish or livestock within a city, rather than out in the countryside. You'll see it on rooftops, in old warehouses, on balconies, and even inside shipping containers."},{"sp":"Professor Hughes","voice":"m","text":"One of the most common techniques used in urban farming is called hydroponics — that's a method of growing plants without soil at all, using nutrient-rich water instead. It's popular in cities because it takes up far less space than traditional farming and can be stacked vertically, which is perfect when land is expensive."},{"sp":"Professor Hughes","voice":"m","text":"To give you a real example, I want to tell you about a project called Skyline Greens, which started on the roof of an old shopping centre. This particular project is based in Manchester, and it's become one of the best-known urban farms in the country."},{"sp":"Professor Hughes","voice":"m","text":"When it first opened, the rooftop farm covered around 1,500 square metres — sorry, let me correct myself, it's actually grown since then, it now covers 2,000 square metres, after an expansion last year."},{"sp":"Professor Hughes","voice":"m","text":"Researchers found that since the project began, the amount of fresh produce grown locally in that part of the city increased by 30% — actually, I should update that figure, the most recent report shows it's now risen to 35%, which is even more impressive than expected."},{"sp":"Professor Hughes","voice":"m","text":"Projects like this don't happen without support, of course. The local city council provided funding of £2 million to help get Skyline Greens off the ground, covering everything from construction to staff training."},{"sp":"Professor Hughes","voice":"m","text":"That investment has paid off in other ways too — the project has created 150 jobs for local residents, ranging from growers and engineers to people who sell the produce directly to nearby restaurants and shops."},{"sp":"Professor Hughes","voice":"m","text":"Of course, it hasn't all been easy. The single biggest challenge the team has faced is limited space — even with vertical growing methods, there simply isn't enough room in a dense city centre to grow everything residents need."},{"sp":"Professor Hughes","voice":"m","text":"Now, why does any of this matter? Well, one of the biggest advantages of urban farming, compared to traditional farming, is the shorter transport distance between where food is grown and where it's eaten. Produce doesn't need to travel hundreds of miles by truck, which means it arrives fresher and produces far fewer emissions along the way."},{"sp":"Professor Hughes","voice":"m","text":"So, where is all this heading? Based on current growth trends, I'd predict that by 2030, most major cities will have at least one significant urban farm of their own, whether that's a rooftop garden, a vertical farm, or a community growing scheme. It's becoming less of a novelty and more of a normal part of how cities feed themselves."},{"sp":"Professor Hughes","voice":"m","text":"That's it for today's lecture — next week we'll look at some of the economic challenges facing urban farms in more detail."}],"questions":[{"type":"gap","q":"Growing method that uses nutrient-rich water instead of soil: ______","a":["hydroponics"],"why":"Ngay đầu bài giảng, giáo sư giới thiệu phương pháp trồng không cần đất là hydroponics."},{"type":"gap","q":"Name of the example project discussed: ______","a":["skyline greens"],"why":"Dự án ví dụ được đặt tên là 'Skyline Greens', bắt đầu trên nóc một trung tâm mua sắm cũ."},{"type":"gap","q":"City where the project is located: ______","a":["manchester"],"why":"Giáo sư cho biết dự án này đặt tại Manchester."},{"type":"gap","q":"Current size of the rooftop farm: ______ square metres","a":["2000","2,000"],"why":"Giáo sư nói ban đầu là 1.500 m² rồi sửa lại là hiện đã tăng lên 2.000 m² sau đợt mở rộng — bẫy sửa số."},{"type":"gap","q":"Recent increase in locally grown produce: ______%","a":["35","35%"],"why":"Số liệu ban đầu nêu là tăng 30%, sau đó giáo sư cập nhật lại thành 35% theo báo cáo mới nhất — bẫy sửa số liệu."},{"type":"gap","q":"Funding provided by the city council: £______ million","a":["2","2 million","£2 million"],"why":"Hội đồng thành phố tài trợ 2 triệu bảng cho dự án Skyline Greens."},{"type":"gap","q":"Number of jobs created by the project: ______","a":["150"],"why":"Dự án đã tạo ra 150 việc làm cho cư dân địa phương."},{"type":"gap","q":"Biggest challenge faced by the project: ______","a":["limited space"],"why":"Giáo sư nêu rõ thách thức lớn nhất là 'limited space' dù đã áp dụng cách trồng theo chiều dọc."},{"type":"mcq","q":"What is considered the biggest advantage of urban farming?","options":["Lower food prices","Shorter transport distances","Larger crop yields","Cheaper labour"],"a":1,"why":"Giáo sư nhấn mạnh lợi ích lớn nhất là khoảng cách vận chuyển ngắn hơn, giúp thực phẩm tươi hơn và giảm khí thải."},{"type":"mcq","q":"What does the lecturer predict will happen by 2030?","options":["Urban farms will replace traditional farms completely","Most major cities will have at least one significant urban farm","Urban farming will become unprofitable","Hydroponics will be banned in cities"],"a":1,"why":"Giáo sư dự đoán đến năm 2030 hầu hết các thành phố lớn sẽ có ít nhất một trang trại đô thị đáng kể."}]}]};
